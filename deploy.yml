name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # allow manual trigger from GitHub UI

# Sets permissions for GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deploy at a time; cancel in-progress if new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          node build.js
          echo "Built dist/index.html:"
          ls -lh dist/

      - name: Verify build
        run: |
          # Fail the deploy if the output is suspiciously small
          SIZE=$(wc -c < dist/index.html)
          echo "Output size: $SIZE bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: dist/index.html looks too small ($SIZE bytes)"
            exit 1
          fi
          # Check build number is stamped
          if grep -q "BUILD_NUMBER\|build dev" dist/index.html; then
            echo "WARNING: build number not injected"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
