<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oskar's River</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,200;0,300;1,200;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#c8d8d0;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%}

/* ── HUD — minimal, ink-wash feel ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}

/* BG — top centre, large serif, very light */
#bg-wrap{
  position:absolute;
  top:max(20px,env(safe-area-inset-top,20px));
  left:50%;transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
}
#bg-num{
  font-family:'Fraunces',serif;font-weight:300;font-size:76px;
  color:rgba(255,255,255,0.92);letter-spacing:-3px;line-height:1;
  text-shadow:0 2px 20px rgba(0,0,0,0.3),0 0 40px rgba(100,220,180,0.2);
}
#bg-arrow{font-size:28px;opacity:0.7;margin-left:6px;vertical-align:middle}
#bg-unit{
  font-family:'DM Mono',monospace;font-weight:300;font-size:11px;
  color:rgba(255,255,255,0.45);letter-spacing:3px;text-transform:uppercase;
  margin-top:2px;
}

/* Mana indicators — bottom corners, very subtle */




/* Time scrub bar — very thin, bottom */
#timebar{
  position:absolute;
  bottom:max(16px,env(safe-area-inset-bottom,16px));
  left:20px;right:20px;
}
#timetrack{height:1px;background:rgba(40,55,50,0.15);border-radius:1px;position:relative}
#timenow{
  position:absolute;top:-4px;
  width:9px;height:9px;border-radius:50%;
  background:rgba(40,55,50,0.4);
  transform:translateX(-50%);
  box-shadow:0 0 0 2px rgba(255,255,255,0.5);
}
#timelabel{
  font-family:'DM Mono',monospace;font-size:8px;
  color:rgba(40,55,50,0.3);letter-spacing:1px;
  text-align:center;margin-top:6px;
}

/* ── LOG BUTTON — minimal circle ── */
#logbtn{
  position:fixed;
  bottom:calc(max(16px,env(safe-area-inset-bottom,16px))+52px);
  right:16px;
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(40,55,50,0.2);
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  cursor:pointer;z-index:20;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .12s;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
#logbtn:active{transform:scale(0.9)}
#logbtn svg{width:20px;height:20px;opacity:0.6}

/* ── LOG SHEET — ink-wash paper ── */
#overlay{position:fixed;inset:0;z-index:28;display:none}
#overlay.open{display:block}
#sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(240,238,228,0.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px 20px 0 0;
  border-top:1px solid rgba(40,55,50,0.1);
  padding:0 0 max(28px,env(safe-area-inset-bottom,28px));
  transform:translateY(110%);
  transition:transform .34s cubic-bezier(0.32,0.72,0,1);
  pointer-events:none;
}
#sheet.open{transform:translateY(0);pointer-events:auto}
.handle{width:32px;height:3px;background:rgba(40,55,50,0.18);border-radius:2px;margin:10px auto}
.sheet-title{
  font-family:'Fraunces',serif;font-style:italic;font-weight:200;font-size:22px;
  color:rgba(40,55,50,0.75);text-align:center;margin:8px 0 2px;letter-spacing:-.3px;
}
.sheet-sub{font-family:'DM Mono',monospace;font-size:9px;color:rgba(40,55,50,0.3);
  text-align:center;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}

.type-row{display:flex;gap:8px;padding:0 18px;margin-bottom:14px}
.tbtn{
  flex:1;padding:12px 6px;border-radius:10px;
  border:1px solid rgba(40,55,50,0.12);background:transparent;
  color:rgba(40,55,50,0.4);cursor:pointer;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;
  text-align:center;transition:all .15s;text-transform:uppercase;
}
.tbtn .ico{font-size:20px;display:block;margin-bottom:5px}
.tbtn.sel-c{background:rgba(200,130,70,0.12);border-color:rgba(200,130,70,0.4);color:rgba(160,90,30,0.8)}
.tbtn.sel-b{background:rgba(80,110,90,0.08);border-color:rgba(80,110,90,0.25);color:rgba(50,80,60,0.8)}
.tbtn.sel-i{background:rgba(70,100,140,0.1);border-color:rgba(70,100,140,0.3);color:rgba(40,70,110,0.8)}

.isec{display:none;padding:0 18px}
.isec.vis{display:block}
.irow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.idot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ifield{
  flex:1;background:rgba(255,255,255,0.6);
  border:1px solid rgba(40,55,50,0.12);border-radius:8px;
  padding:10px 12px;font-family:'Fraunces',serif;font-weight:200;
  font-size:26px;color:rgba(40,55,50,0.8);outline:none;text-align:center;
  transition:border-color .15s;
}
.ifield:focus{border-color:rgba(40,55,50,0.3);background:rgba(255,255,255,0.8)}
.ifield::placeholder{color:rgba(40,55,50,0.2);font-size:16px;font-style:italic}
.iunit{font-family:'DM Mono',monospace;font-size:10px;color:rgba(40,55,50,0.3);min-width:24px;letter-spacing:.5px}

.bgchips{display:flex;gap:4px;padding:0 18px;margin-bottom:10px}
.bgchip{
  flex:1;padding:7px 2px;text-align:center;border-radius:7px;
  border:1px solid rgba(40,55,50,0.1);background:transparent;
  font-family:'DM Mono',monospace;font-size:10px;color:rgba(40,55,50,0.35);cursor:pointer;
  transition:all .12s;
}
.bgchip.on{background:rgba(40,55,50,0.08);border-color:rgba(40,55,50,0.25);color:rgba(40,55,50,0.7)}

.sugbox{
  margin:0 18px 10px;padding:8px 12px;
  background:rgba(70,100,140,0.06);border:1px solid rgba(70,100,140,0.15);
  border-radius:8px;text-align:center;display:none;
}
.sugval{font-family:'Fraunces',serif;font-weight:200;font-size:24px;color:rgba(40,70,110,0.75)}
.sugnote{font-family:'DM Mono',monospace;font-size:9px;color:rgba(70,100,140,0.45);margin-top:2px;letter-spacing:.3px}

#dropbtn{
  display:block;margin:6px 18px 0;width:calc(100% - 36px);padding:14px;
  border-radius:10px;border:1px solid rgba(40,55,50,0.2);
  background:rgba(40,55,50,0.08);
  color:rgba(40,55,50,0.7);font-family:'Fraunces',serif;font-style:italic;
  font-weight:200;font-size:17px;cursor:pointer;letter-spacing:-.2px;
  transition:all .12s;
}
#dropbtn:not(:disabled):hover{background:rgba(40,55,50,0.13)}
#dropbtn:disabled{opacity:0.3;cursor:default}

/* Toast */
#toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.9);
  background:rgba(240,238,228,0.95);backdrop-filter:blur(12px);
  border:1px solid rgba(40,55,50,0.12);border-radius:12px;
  padding:10px 20px;font-family:'Fraunces',serif;font-style:italic;font-weight:200;
  font-size:15px;color:rgba(40,55,50,0.7);z-index:50;
  opacity:0;pointer-events:none;transition:all .18s;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Loading */
#loading{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s;
}
#loading.gone{opacity:0;pointer-events:none}
.ripwrap{position:relative;width:40px;height:40px}
.rip{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(40,55,50,0.25);animation:rp 2s ease-out infinite}
.rip:nth-child(2){animation-delay:.5s}.rip:nth-child(3){animation-delay:1s}
@keyframes rp{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.6);opacity:0}}
.ltitle{font-family:'Fraunces',serif;font-style:italic;font-weight:200;font-size:26px;color:rgba(40,55,50,0.5);margin-top:24px}
.lsub{font-family:'DM Mono',monospace;font-size:9px;color:rgba(40,55,50,0.25);letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>

<div id="loading">
  <div class="ripwrap"><div class="rip"></div><div class="rip"></div><div class="rip"></div></div>
  <div class="ltitle">Oskar's River</div>
  <div class="lsub">finding the current</div>
  <div style="font-family:'DM Mono',monospace;font-size:8px;color:rgba(40,55,50,0.2);margin-top:8px;letter-spacing:1px">build 20260326-23</div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <!-- BG — top centre, clear of safe area -->
  <div id="bg-wrap">
    <div id="bg-num">—<span id="bg-arrow"></span></div>
    <div id="bg-unit">mmol/L</div>
    <div id="stale-warn" style="display:none;font-family:'DM Mono',monospace;
      font-size:10px;color:rgba(255,160,60,0.9);letter-spacing:.5px;
      margin-top:4px;text-align:center"></div>
  </div>

  <!-- COB/IOB pill — bottom centre above timebar -->
  <div id="mana-pill" style="
    position:absolute;
    bottom:calc(max(16px,env(safe-area-inset-bottom,16px))+28px);
    left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;pointer-events:none">
    <div style="display:flex;align-items:center;gap:5px;
      background:rgba(0,0,0,0.18);border-radius:12px;padding:4px 10px;
      backdrop-filter:blur(6px)">
      <div style="width:6px;height:6px;border-radius:50%;background:#3ecfa0;flex-shrink:0"></div>
      <span style="font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:.5px">COB</span>
      <span id="mc-val" style="font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:rgba(255,255,255,0.75)">—g</span>
    </div>
    <div style="display:flex;align-items:center;gap:5px;
      background:rgba(0,0,0,0.18);border-radius:12px;padding:4px 10px;
      backdrop-filter:blur(6px)">
      <div style="width:6px;height:6px;border-radius:50%;background:#2855c8;flex-shrink:0"></div>
      <span style="font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:.5px">IOB</span>
      <span id="mi-val" style="font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:rgba(255,255,255,0.75)">—U</span>
    </div>
  </div>

  <div id="timebar">
    <div id="timetrack"><div id="timenow"></div></div>
    <div id="timelabel">—</div>
  </div>
</div>

<!-- Settings + live dot — bottom left, stacked cleanly -->
<button onclick="openSettings()" style="
  position:fixed;
  bottom:calc(max(20px,env(safe-area-inset-bottom,20px)));
  left:16px;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;
  font-size:16px;opacity:0.6;transition:opacity .15s;pointer-events:auto"
  title="CGM settings">⚙</button>
<div id="live-dot" style="
  position:fixed;
  bottom:calc(max(20px,env(safe-area-inset-bottom,20px))+44px);
  left:24px;
  width:7px;height:7px;border-radius:50%;background:#c87832;opacity:0;
  transition:background .5s,opacity .5s;z-index:20;pointer-events:none" title="CGM status"></div>

<!-- Return to Now button — appears when scrolled back -->
<button id="now-btn" onclick="returnToNow()" style="
  position:fixed;
  bottom:calc(max(20px,env(safe-area-inset-bottom,20px)));
  right:16px;
  padding:7px 14px;border-radius:20px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.8px;
  color:rgba(255,255,255,0.6);text-transform:uppercase;
  cursor:pointer;z-index:20;pointer-events:auto;
  opacity:0;transition:opacity .3s">
  ◉ now
</button>

<button id="logbtn" onclick="openSheet()">
  <svg viewBox="0 0 20 20" fill="none">
    <!-- Water drop -->
    <path d="M10 3 C10 3 5 9 5 12.5 A5 5 0 0 0 15 12.5 C15 9 10 3 10 3Z"
      fill="rgba(40,55,50,0.5)"/>
  </svg>
</button>

<div id="overlay" onclick="closeSheet()"></div>

<div id="sheet">
  <div class="handle"></div>
  <div class="sheet-title">add to the flow</div>
  <div class="sheet-sub">carbs · bolus · or both</div>

  <!-- Type selector -->
  <div class="type-row">
    <button class="tbtn" id="tb-c" onclick="selType('c')"><span class="ico">🌾</span>carbs</button>
    <button class="tbtn" id="tb-b" onclick="selType('b')"><span class="ico">🍃</span>meal</button>
    <button class="tbtn" id="tb-i" onclick="selType('i')"><span class="ico">💧</span>bolus</button>
  </div>

  <!-- Time — always visible, defaults to now -->
  <div style="display:flex;align-items:center;gap:8px;padding:0 18px;margin-bottom:12px">
    <span style="font-family:'DM Mono',monospace;font-size:9px;color:rgba(40,55,50,0.35);
      letter-spacing:1px;text-transform:uppercase;white-space:nowrap">when</span>
    <input id="in-time" type="datetime-local"
      style="flex:1;padding:8px 10px;border-radius:8px;
      border:1px solid rgba(40,55,50,0.12);background:rgba(255,255,255,0.55);
      font-family:'DM Mono',monospace;font-size:12px;color:rgba(40,55,50,0.7);outline:none">
    <button onclick="setTimeNow()" style="padding:6px 10px;border-radius:7px;
      border:1px solid rgba(40,55,50,0.12);background:rgba(40,55,50,0.05);
      font-family:'DM Mono',monospace;font-size:9px;color:rgba(40,55,50,0.4);
      cursor:pointer;letter-spacing:.5px">now</button>
  </div>

  <!-- Carbs -->
  <div class="isec" id="sec-c">
    <div class="irow">
      <div class="idot" style="background:rgba(62,207,160,0.8)"></div>
      <input class="ifield" id="in-c" type="number" inputmode="decimal"
        placeholder="grams" min="0" max="200" step="1" oninput="onInp()">
      <span class="iunit">g</span>
    </div>
  </div>

  <!-- Insulin -->
  <div class="isec" id="sec-i">
    <div class="irow">
      <div class="idot" style="background:rgba(40,85,200,0.8)"></div>
      <input class="ifield" id="in-i" type="number" inputmode="decimal"
        placeholder="units" min="0" max="20" step="0.5" oninput="onInp()">
      <span class="iunit">U</span>
    </div>
  </div>

  <!-- BG -->
  <div class="isec" id="sec-bg">
    <div class="irow">
      <div class="idot" style="background:rgba(40,55,50,0.3)"></div>
      <input class="ifield" id="in-bg" type="number" inputmode="decimal"
        placeholder="BG now" min="2" max="25" step="0.1" oninput="onInp()">
      <span class="iunit">mmol</span>
    </div>
    <div class="bgchips">
      <div class="bgchip" onclick="setBG(4)">4.0</div>
      <div class="bgchip" onclick="setBG(5.5)">5.5</div>
      <div class="bgchip" onclick="setBG(7)">7.0</div>
      <div class="bgchip" onclick="setBG(9)">9.0</div>
      <div class="bgchip" onclick="setBG(12)">12.0</div>
    </div>
  </div>

  <!-- Saved meals -->
  <div id="saved-meals-row" style="display:none;padding:0 18px;margin-bottom:10px">
    <div style="font-family:'DM Mono',monospace;font-size:9px;color:rgba(40,55,50,0.3);
      letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">recent meals</div>
    <div id="saved-meals-chips" style="display:flex;flex-wrap:wrap;gap:5px"></div>
  </div>

  <!-- Bolus suggestion -->
  <div class="sugbox" id="sugbox">
    <div class="sugval" id="sugval">—</div>
    <div class="sugnote" id="sugnote"></div>
  </div>

  <button id="dropbtn" onclick="commitDrop()" disabled>flow it in</button>

<div id="toast"></div>

function histAt(t) {
  if (t <= HISTORY_RAW[0].t) return HISTORY_RAW[0];
  if (t >= HISTORY_RAW[HISTORY_RAW.length-1].t) return HISTORY_RAW[HISTORY_RAW.length-1];

  const a=HISTORY_RAW[lo], b=HISTORY_RAW[hi], f=(t-a.t)/(b.t-a.t);
  return { bg:a.bg+f*(b.bg-a.bg), iob:a.iob+f*(b.iob-a.iob),

}
function dataAt(t) {

  for (const s of SESSION) {

    if (m<0||m>240) continue;

  return { bg:h.bg, iob:h.iob+si, cob:h.cob+sc, pen:h.pen };

function iobF(m) {
  if (m<=0) return 1; if (m>=240) return 0;
  let d=0; for(let x=0;x<m;x+=2) d+=(x<=70?x/70:Math.max(0,1-(x-70)/170))*2;

  if (m<=0) return 1; if (m>=240) return 0;
  const pk=Math.max(20,95-gi),s=pk/2.2,z=(m-pk)/s;

    lily:`rgba(${lilyC[0]},${lilyC[1]},${lilyC[2]},`,
    causticRGB:causticC, causticA,
    bgText: isNight ? 'rgba(200,225,255,0.75)' : name==='dusk' ? 'rgba(255,220,180,0.8)' : name==='dawn' ? 'rgba(255,200,140,0.8)' : 'rgba(240,255,245,0.85)',
    name, isNight,
    sunFrac: (h>=5&&h<19) ? (h-5)/14 : (h>=19 ? (h-19)/10+1 : h/5),
  };
}
// ── ANIMATION STATE ──────────────────────────────────────────
let phi=0, t0=0, treeScrollX=0;
let bgPrev = null;

// Seed for deterministic "random" positions (lily pads, trees)
function seededRand(seed) {
  let s = seed;
  return function() { s=(s*16807+0)%2147483647; return (s-1)/2147483646; };
}

// ── DRAWING: SKY ─────────────────────────────────────────────
function drawSky(pal) {
  const skyH = HORIZON * H;

  // Sky gradient
  const sg = CX.createLinearGradient(0,0,0,skyH);
  sg.addColorStop(0,   pal.sky0);
  sg.addColorStop(0.6, pal.sky1);
  sg.addColorStop(1,   pal.sky2);
  CX.fillStyle=sg; CX.fillRect(0,0,W,skyH);

  // Sun / Moon — arc across sky based on hour
  // sunFrac 0=dawn-edge, 0.5=noon (or midnight), 1=dusk-edge
  // Arc: rises left, peaks centre, sets right — parabolic path
  const sf = Math.max(0, Math.min(1, pal.sunFrac||0.5));
  const sunX = W * (0.1 + sf*0.8);
  const peakFrac = Math.sin(sf*Math.PI); // 0 at edges, 1 at noon
  // Sun sits LOW — at or just below mountain line so mountains occlude it
  const sunY = skyH*(0.82 - peakFrac*0.35); // stays near horizon
  const sunR = pal.sunR || 60;

  // Corona / atmosphere glow (large, soft)
  const cg = CX.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(1,sunR*3.5));
  const sc = pal.sunRGB||[255,255,200];
  cg.addColorStop(0,   `rgba(${sc},${(pal.sunA||0.5)*0.4})`);
  cg.addColorStop(0.3, `rgba(${sc},${(pal.sunA||0.5)*0.15})`);
  cg.addColorStop(1,   'transparent');
  CX.fillStyle=cg; CX.beginPath(); CX.arc(sunX,sunY,sunR*3.5,0,Math.PI*2); CX.fill();

  // Disc
  const dg = CX.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(1,sunR));
  dg.addColorStop(0, `rgba(${sc},${pal.sunA||0.5})`);
  dg.addColorStop(0.6,`rgba(${sc},${(pal.sunA||0.5)*0.6})`);
  dg.addColorStop(1,  `rgba(${sc},0)`);
  CX.fillStyle=dg; CX.beginPath(); CX.arc(sunX,sunY,sunR,0,Math.PI*2); CX.fill();

  // Night: add moon crescent + stars
  if (pal.isNight) {
    // Moon crescent — overlay darker circle offset
    CX.save(); CX.globalAlpha=0.5;
    CX.fillStyle=`rgb(${pal.sky0.slice(1).match(/../g).map(x=>parseInt(x,16)+8).join(',')})`;
    CX.beginPath(); CX.arc(sunX+sunR*0.3, sunY-sunR*0.1, sunR*0.82, 0, Math.PI*2); CX.fill();
    CX.restore();
    // Stars
    CX.save();
    const srng = seededRand(7);
    for (let i=0;i<60;i++) {
      const sx=srng()*W, sy=srng()*skyH*0.85;
      const sr=0.4+srng()*1.2;
      const sa=0.2+srng()*0.5;
      const twinkle = 0.7+Math.sin(phi*1.5+i*0.8)*0.3;
      CX.globalAlpha=sa*twinkle;
      CX.fillStyle='rgba(220,230,255,1)';
      CX.beginPath(); CX.arc(sx,sy,sr,0,Math.PI*2); CX.fill();
    }
    CX.restore();
  }

  // Water reflection of sun (vertical shimmer) — moved here from drawWater
  const refX = NOW_X*W;
  const refGrad = CX.createLinearGradient(sunX,skyH,refX,H);
  refGrad.addColorStop(0, `rgba(${sc},${(pal.sunA||0.5)*0.25})`);
  refGrad.addColorStop(0.5,`rgba(${sc},${(pal.sunA||0.5)*0.08})`);
  refGrad.addColorStop(1, 'transparent');

  // Ink-wash mountain silhouettes — layered, fading into mist
  const rng = seededRand(42);
  for (let layer=3; layer>=0; layer--) {
    const alpha = 0.08 + layer*0.06;
    const yBase = skyH*(0.5 + layer*0.12);
    const yAmp  = skyH*(0.08 + layer*0.04);
    CX.save();
    CX.globalAlpha=alpha;
    CX.fillStyle = pal.treeFar.replace('0.2','1').replace('0.3','1').replace('0.6','1').replace('0.8','1');
    CX.beginPath();
    CX.moveTo(0, H);
    // Build mountain profile
    let x=0;
    while (x<=W+80) {
      const peakW = 60+rng()*120;
      const peakH = yAmp*(0.3+rng()*0.7);
      // Left slope
      CX.lineTo(x, yBase);
      // Peak with bezier
      CX.bezierCurveTo(x+peakW*0.3,yBase-peakH*0.8, x+peakW*0.5,yBase-peakH, x+peakW*0.5,yBase-peakH);
      CX.bezierCurveTo(x+peakW*0.5,yBase-peakH, x+peakW*0.7,yBase-peakH*0.8, x+peakW,yBase);
      x += peakW;
    }
    CX.lineTo(W, H); CX.closePath(); CX.fill();
    CX.restore();
  }

  // Pagoda silhouette — distant, very faint
  const pgX = W*0.82, pgY = skyH*0.6;
  CX.save(); CX.globalAlpha=0.12;
  CX.fillStyle = pal.treeFar.replace('0.2','1').replace('0.25','1').replace('0.3','1');
  drawPagoda(pgX, pgY, 14);
  CX.restore();

  // ── SHORELINE FEATURES — reeds, birds, distant jetty ──────────────
  const sfRng = seededRand(77);
  const skyH2 = HORIZON*H;

  // Reeds — vertical lines at horizon, both sides, drifting slightly
  CX.save();
  for (let i=0; i<22; i++) {
    const rx = sfRng()*W;
    const rDrift = ((rx - treeScrollX*0.08) % W + W) % W;
    const rh = 12 + sfRng()*28;
    const rw = 0.8 + sfRng()*1.2;
    const ra = 0.15 + sfRng()*0.25;
    const rside = i < 11 ? rDrift*0.22 : W - rDrift*0.22;
    CX.globalAlpha = ra;
    CX.fillStyle = pal.treeFar.replace(/[\d.]+\)$/, '1)');
    CX.fillRect(rside, skyH2-rh, rw, rh);
    // Reed head
    CX.globalAlpha = ra*0.8;
    CX.beginPath();
    CX.ellipse(rside+rw/2, skyH2-rh, rw*1.8, rw*4, 0, 0, Math.PI*2);
    CX.fill();
  }

  // Distant jetty — simple geometric shape on one side
  const jettyX = W*0.18 - (treeScrollX*0.05 % (W*0.6));
  if (jettyX > -60 && jettyX < W+60) {
    CX.globalAlpha=0.2;
    CX.fillStyle=pal.treeFar.replace(/[\d.]+\)$/, '1)');
    // Platform
    CX.fillRect(jettyX, skyH2-4, 35, 3);
    // Posts
    for (const px of [jettyX+5, jettyX+17, jettyX+29]) {
      CX.fillRect(px, skyH2-2, 2, 8);
    }
  }

  // Birds — simple V shapes drifting across sky
  for (let i=0; i<5; i++) {
    const bx = ((sfRng()*W*1.5 + treeScrollX*(0.03+i*0.01)) % (W*1.4)) - W*0.2;
    const by = skyH2*(0.15 + sfRng()*0.4);
    const bs = 3 + sfRng()*5;
    const ba = 0.12 + sfRng()*0.18;
    CX.globalAlpha=ba;
    CX.strokeStyle=pal.treeFar.replace(/[\d.]+\)$/, '1)');
    CX.lineWidth=0.8;
    CX.beginPath();
    CX.moveTo(bx-bs, by); CX.lineTo(bx, by-bs*0.5); CX.lineTo(bx+bs, by);
    CX.stroke();
  }

  // Distant house silhouette
  const houseX = W*0.75 - (treeScrollX*0.04 % (W*0.8));
  if (houseX > -40 && houseX < W+40) {
    CX.globalAlpha=0.12;
    CX.fillStyle=pal.treeFar.replace(/[\d.]+\)$/, '1)');
    CX.fillRect(houseX, skyH2-14, 22, 12); // walls
    CX.beginPath(); // roof
    CX.moveTo(houseX-3, skyH2-14);
    CX.lineTo(houseX+11, skyH2-24);
    CX.lineTo(houseX+25, skyH2-14);
    CX.closePath(); CX.fill();
  }
  CX.restore();

  // Horizon mist band
  const hg = CX.createLinearGradient(0,skyH-20,0,skyH+30);
  hg.addColorStop(0,'transparent');
  hg.addColorStop(0.4,pal.mist);
  hg.addColorStop(1,'transparent');
  CX.fillStyle=hg; CX.fillRect(0,skyH-20,W,50);
}

function drawPagoda(x, y, scale) {
  // Simple pagoda silhouette — stacked roofs
  for (let i=0; i<4; i++) {
    const yw = scale*(0.8-i*0.15);
    const yh = scale*0.25;
    const yy = y - i*(scale*0.4);
    CX.beginPath();
    CX.moveTo(x-yw, yy); CX.lineTo(x+yw, yy); CX.lineTo(x+yw*0.6, yy-yh);
    CX.lineTo(x-yw*0.6, yy-yh); CX.closePath(); CX.fill();
    // Roof upturn
    CX.beginPath();
    CX.moveTo(x-yw, yy); CX.bezierCurveTo(x-yw-scale*0.3, yy+scale*0.1, x-yw-scale*0.4, yy+scale*0.15, x-yw-scale*0.2, yy+scale*0.05); CX.fill();
    CX.beginPath();
    CX.moveTo(x+yw, yy); CX.bezierCurveTo(x+yw+scale*0.3, yy+scale*0.1, x+yw+scale*0.4, yy+scale*0.15, x+yw+scale*0.2, yy+scale*0.05); CX.fill();
  }
  // Spire
  CX.beginPath(); CX.moveTo(x,y-scale*4); CX.lineTo(x,y-scale*1.5); CX.stroke();
}

// ── DRAWING: WATER ───────────────────────────────────────────
function drawWater(pal, d) {
  const skyH = HORIZON*H;

  // Base water — deep jewel green (lily pad banks palette)
  const wg = CV.getContext('2d').createLinearGradient ? null : null; // unused
  const wgrad = CX.createLinearGradient(0,skyH,0,H);
  wgrad.addColorStop(0,   pal.water0);
  wgrad.addColorStop(0.4, pal.water1);
  wgrad.addColorStop(0.85,pal.water2);
  wgrad.addColorStop(1,   pal.water2);
  CX.fillStyle=wgrad; CX.fillRect(0,skyH,W,H-skyH);

  // ── ANIMATED CAUSTIC LIGHT STREAKS ──────────────────────────────────────
  // Like the bright lime-green light shafts in lily_pad_banks
  CX.save();
  const cc = pal.causticRGB || [80,200,120];
  const ca = pal.causticA || 0.2;
  const rng = seededRand(5);
  for (let i=0; i<16; i++) {
    // Each streak drifts leftward (river current) over time
    const baseX = (rng()*W - (phi * 18) % W + W*2) % W;
    const baseY = skyH + rng()*(H-skyH)*0.9;
    const len   = 30 + rng()*120;
    const angle = -0.15 + rng()*0.3 + Math.sin(phi*0.3+i)*0.05;
    const width = 1.5 + rng()*4;
    const alpha = ca * (0.5 + Math.sin(phi*0.8+i*0.7+rng()*3)*0.5);

    CX.globalAlpha = Math.max(0, alpha);
    const sg = CX.createLinearGradient(baseX,baseY,
      baseX+Math.cos(angle)*len, baseY+Math.sin(angle)*len);
    sg.addColorStop(0, `rgba(${cc},0)`);
    sg.addColorStop(0.3,`rgba(${cc},${alpha*1.5})`);
    sg.addColorStop(0.7,`rgba(${cc},${alpha})`);
    sg.addColorStop(1,  `rgba(${cc},0)`);
    CX.strokeStyle=sg; CX.lineWidth=width;
    CX.lineCap='round';
    CX.beginPath();
    CX.moveTo(baseX, baseY);
    CX.lineTo(baseX+Math.cos(angle)*len, baseY+Math.sin(angle)*len);
    CX.stroke();
  }
  CX.globalAlpha=1;

  // Night: star reflections
  if (pal.isNight) {
    const srng=seededRand(13);
    for (let i=0;i<25;i++) {
      const sx=srng()*W, sy=skyH+srng()*(H-skyH)*0.5;
      const twinkle=0.5+Math.sin(phi*1.4+i*1.3)*0.5;
      CX.globalAlpha=(0.05+srng()*0.12)*twinkle;
      CX.fillStyle='rgba(200,220,255,1)';
      CX.beginPath(); CX.arc(sx,sy,0.6+srng()*1.2,0,Math.PI*2); CX.fill();
    }
  }

  // Sun reflection shimmer
  const nowX=NOW_X*W;
  const sc=pal.sunRGB||[255,255,200];
  const refG=CX.createLinearGradient(nowX-15,skyH,nowX+15,H);
  refG.addColorStop(0,`rgba(${sc},${(pal.sunA||0.4)*0.3})`);
  refG.addColorStop(0.4,`rgba(${sc},${(pal.sunA||0.4)*0.1})`);
  refG.addColorStop(1,'transparent');
  CX.globalAlpha=0.6;
  CX.fillStyle=refG; CX.fillRect(nowX-15,skyH,30,H-skyH);
  CX.globalAlpha=1;
  CX.restore();
}
// ── DRAWING: LILY PADS ───────────────────────────────────────
// Hyper zone (top of water) and hypo zone (bottom of water)
// Density increases as BG approaches danger
function drawLilyPads(pal, d) {
  const skyH = HORIZON*H;
  const wH   = H - skyH;
  const waterTop = skyH;
  const waterBot = H;

  // How close to danger zones — drives bank intrusion
  const hyperProx = Math.max(0, Math.min(1, (d.bg - BG_HIGH) / 4.0)); // 0 at 10, 1 at 14
  const hypoProx  = Math.max(0, Math.min(1, (BG_LOW + 2.0 - d.bg) / 2.0)); // 0 at 5.9, 1 at 3.9

  // Bank intrusion depth — how far banks encroach into the river
  // At full danger: bank covers 40% of water height
  const topIntrude = hyperProx * wH * 0.42; // top bank comes down
  const botIntrude = hypoProx  * wH * 0.42; // bottom bank comes up

  const lc = pal.lily || 'rgba(45,90,35,';

  // ── TOP BANK (hyperglycemia zone) ────────────────────────────────
  // Dense lily pad zone from top of water down to topIntrude depth
  // Always has a thin base strip, grows dramatically as BG rises
  const topZoneH = Math.max(wH*0.06, topIntrude + wH*0.04);
  drawBank(waterTop, topZoneH, 1, lc, hyperProx, 33);

  // ── BOTTOM BANK (hypoglycemia zone) ──────────────────────────────
  // Dense lily pad zone from bottom up
  const botZoneH = Math.max(wH*0.06, botIntrude + wH*0.04);
  drawBank(waterBot - botZoneH, botZoneH, -1, lc, hypoProx, 44);

  // ── BANK EDGE LINE — sharp visual boundary ────────────────────────
  // Shows as a clearly defined shoreline that the boat approaches
  if (topIntrude > 5) {
    const edgeY = waterTop + topIntrude;
    CX.save();
    CX.globalAlpha = 0.15 + hyperProx*0.35;
    // Wavy edge line
    CX.strokeStyle = `rgba(${(pal.causticRGB||[80,180,80]).join(',')},1)`;
    CX.lineWidth = 1.5;
    CX.beginPath();
    for (let x=0; x<=W; x+=4) {
      const wy = edgeY + Math.sin(x*0.04+phi*0.8)*3*(1+hyperProx);
      x===0 ? CX.moveTo(x,wy) : CX.lineTo(x,wy);
    }
    CX.stroke();
    CX.restore();
  }
  if (botIntrude > 5) {
    const edgeY = waterBot - botIntrude;
    CX.save();
    CX.globalAlpha = 0.15 + hypoProx*0.35;
    CX.strokeStyle = 'rgba(80,130,220,0.9)';
    CX.lineWidth = 1.5;
    CX.beginPath();
    for (let x=0; x<=W; x+=4) {
      const wy = edgeY + Math.sin(x*0.04+phi*0.8+2)*3*(1+hypoProx);
      x===0 ? CX.moveTo(x,wy) : CX.lineTo(x,wy);
    }
    CX.stroke();
    CX.restore();
  }
}

function drawBank(startY, height, dir, lc, danger, seed) {
  if (height < 4) return;
  const drift = (treeScrollX * 0.4) % (W * 0.9);
  const rng   = seededRand(seed);
  const count = Math.floor(6 + danger*20 + height*0.4);
  CX.save();
  for (let i=0; i<count; i++) {
    const px = ((rng()*W*1.5 - drift) % (W*1.5)) - W*0.25;
    const depthF = Math.pow(rng(), 0.6); // bias toward edge
    const py = startY + (dir > 0 ? depthF*height : (1-depthF)*height);
    if (dir < 0 && py < startY) continue;
    if (dir > 0 && py > startY+height) continue;
    const r = Math.max(0.5, 6 + rng()*16*(1-depthF*0.3));
    const a = Math.max(0.05, (1-depthF*0.5)*(0.2 + danger*0.5));
    // Pad body
    CX.globalAlpha = a;
    CX.fillStyle = lc + '1)';
    CX.beginPath();
    CX.ellipse(px, py, Math.max(0.5,r), Math.max(0.3,r*0.6), rng()*Math.PI, 0, Math.PI*2);
    CX.fill();
    // Highlight
    CX.globalAlpha = a*0.35;
    CX.fillStyle = 'rgba(140,210,80,1)';
    CX.beginPath();
    CX.ellipse(px-r*0.2, py-r*0.15, Math.max(0.3,r*0.3), Math.max(0.2,r*0.18), 0, 0, Math.PI*2);
    CX.fill();
  }
  CX.restore();
}
// ── DRAWING: MANA WAKES ──────────────────────────────────────
// The wake spreads from the boat's stern (nowX) back into the past (left)
// COB wake rises above the boat's centreline (upper water)
// IOB wake drops below the boat's centreline (lower water)
// Both converge to a point at the boat

function buildWakePts(valueKey, yMapFn, futureMinutes) {
  const nowT  = viewTime;
  const leftT = Math.max(CGM_START, xT(0));
  // Past points
  const n = Math.min(350, Math.max(80, Math.floor(W/1.5)));
  const pts = [];
  for (let i=0; i<=n; i++) {
    const t = leftT + (i/n)*(nowT-leftT);
    const d = dataAt(t);
    const x = tX(t);
    const y = yMapFn(d[valueKey], x, d.bg);
    pts.push({ x, y, val:d[valueKey], t, future:false });
  }
  // Future prediction points (if requested)
  if (futureMinutes && futureMinutes>0) {
    const steps = Math.min(60, futureMinutes/5);
    for (let i=1; i<=steps; i++) {
      const ft = nowT + i*(futureMinutes/steps)*60000;
      const fx = tX(ft);
      if (fx > W+20) break;
      // Project COB/IOB forward
      const d0 = dataAt(nowT);
      // decay from now
      const minsAhead = i*(futureMinutes/steps);
      let fval = d0[valueKey];
      if (valueKey==='cob') fval = d0.cob * cobF(minsAhead);
      else fval = d0.iob * iobF(minsAhead);
      // Add pending session entries
      for (const s of SESSION) {
        const elapsed = (ft-s.t)/60000;
        if (elapsed<0||elapsed>240) continue;
        if (valueKey==='cob') fval += (s.c||0)*cobF(elapsed);
        else fval += (s.u||0)*iobF(elapsed);
      }
      // Pending (uncommitted) sheet entry for preview
      if (window._pendingDrop) {
        const pd=window._pendingDrop;
        const pe=(ft-Date.now())/60000; // future from now
        if (pe>=0&&pe<240) {
          if (valueKey==='cob') fval += (pd.c||0)*cobF(pe);
          else fval += (pd.u||0)*iobF(pe);
        }
      }
      // Predict BG: current + net effect
      const futureBG = Math.max(2.5,Math.min(18, d0.bg));
      const fy = yMapFn(Math.max(0,fval), fx, futureBG);
      pts.push({x:fx, y:fy, val:Math.max(0,fval), t:ft, future:true});
    }
  }
  return pts;
}

// Y mapping for wake lines
// The boat sits at horizon*(0.6)+waterCentre-ish — near the middle of water
// Boat Y computed dynamically from BG
function boatYfromBG(bg) {
  const skyH = HORIZON*H;
  const waterH = H - skyH;
  const safeTop = skyH + waterH*0.08;
  const safeBot = H    - waterH*0.08;
  const frac = Math.max(0,Math.min(1,(bg-2.5)/(18-2.5)));
  return safeBot - frac*(safeBot-safeTop);
}
// Alias used by BG trail
const bgToY = (bg) => boatYfromBG(bg);
const BOAT_Y_FRAC = HORIZON + (1-HORIZON)*0.42; // fallback only
function cobY(cob, x, bgAtX) {
  const by = bgAtX!=null ? boatYfromBG(bgAtX) : BOAT_Y_FRAC*H;
  const topY = HORIZON*H + (H-HORIZON*H)*0.04;
  const frac = Math.min(1, cob/MAX_COB);
  const pX   = Math.max(0.01, x/(NOW_X*W));
  const spread = 1 + (1-pX)*0.25;
  return by - frac*(by-topY)*spread;
}
function iobY(iob, x, bgAtX) {
  const by  = bgAtX!=null ? boatYfromBG(bgAtX) : BOAT_Y_FRAC*H;
  const botY = H - (H-HORIZON*H)*0.04;
  const frac = Math.min(1, iob/MAX_IOB);
  const pX   = Math.max(0.01, x/(NOW_X*W));
  const spread = 1 + (1-pX)*0.25;
  return by + frac*(botY-by)*spread;
}

function drawWake(pts, colorRGB, glowHex, maxVal, isUpper, isFuture) {
  if (pts.length < 2) return;
  const pastPts   = pts.filter(p=>!p.future);
  const futurePts = pts.filter(p=>p.future);
  if (pastPts.length < 2 && futurePts.length < 2) return;
  const tip     = pastPts.length>0 ? pastPts[pastPts.length-1] : pts[0];
  const tipFrac = Math.max(0, Math.min(1, tip.val/maxVal));

  CX.save();

  // ── ZONE FILL: coloured water tint above/below the line ──────────────
  if (pastPts.length > 1) {
    const skyH  = HORIZON*H;
    const edgeY = isUpper ? skyH+1 : H-1;
    const smooth = smoothPath(pastPts);
    // Single smooth gradient, no hard edges
    const zg = CX.createLinearGradient(pastPts[0].x, 0, tip.x, 0);
    zg.addColorStop(0,   `rgba(${colorRGB},0)`);
    zg.addColorStop(0.4, `rgba(${colorRGB},${0.06*tipFrac})`);
    zg.addColorStop(0.8, `rgba(${colorRGB},${0.15*tipFrac})`);
    zg.addColorStop(1,   `rgba(${colorRGB},${0.28*tipFrac})`);
    CX.fillStyle = zg;
    zoneFill(smooth, edgeY);
    CX.fill();
  }

  // ── WAKE RIBBON: smooth tapered shape, widens toward past ────────────
  if (pastPts.length > 2) {
    const swirled = swirlPath(pastPts, 0.6, 1.0, 0, maxVal);
    const TOP=[], BOT=[];
    for (let i=0; i<swirled.length; i++) {
      const p       = swirled[i];
      const ageFrac = Math.max(0, Math.min(1, (viewTime-p.t)/(2.5*3600000)));
      const vf      = Math.min(1, p.val/maxVal);
      const hw      = Math.max(0.5, (1.5 + ageFrac*22) * Math.max(0.05, vf));
      const perp    = getPerpendicular(swirled, i);
      TOP.push({x:p.x+perp.nx*hw, y:p.y+perp.ny*hw});
      BOT.push({x:p.x-perp.nx*hw, y:p.y-perp.ny*hw});
    }
    // Smooth horizontal gradient — no hard left edge
    const rg = CX.createLinearGradient(swirled[0].x, 0, tip.x, 0);
    rg.addColorStop(0,   `rgba(${colorRGB},0)`);
    rg.addColorStop(0.25,`rgba(${colorRGB},${0.05*tipFrac})`);
    rg.addColorStop(0.65,`rgba(${colorRGB},${0.22*tipFrac})`);
    rg.addColorStop(1,   `rgba(${colorRGB},${0.55*tipFrac})`);
    CX.fillStyle=rg;
    CX.beginPath();
    CX.moveTo(TOP[0].x, TOP[0].y);
    for (let i=1;i<TOP.length;i++) {
      const p=TOP[i-1],c=TOP[i];
      CX.quadraticCurveTo(p.x,p.y,(p.x+c.x)/2,(p.y+c.y)/2);
    }
    CX.lineTo(TOP[TOP.length-1].x,TOP[TOP.length-1].y);
    for (let i=BOT.length-1;i>=0;i--) {
      const c=BOT[i],n=i>0?BOT[i-1]:BOT[0];
      CX.quadraticCurveTo(c.x,c.y,(c.x+n.x)/2,(c.y+n.y)/2);
    }
    CX.closePath(); CX.fill();
  }

  // ── GLOWING CORE LINE ─────────────────────────────────────────────────
  if (pastPts.length > 1) {
    const core = swirlPath(pastPts, 0.3, 0.8, 0, maxVal);
    CX.lineJoin='round'; CX.lineCap='round';
    const segs=14, step=Math.max(1,Math.floor(core.length/segs));
    for (let s=0;s<segs;s++) {
      const i0=s*step, i1=Math.min(core.length-1,(s+1)*step);
      const frac=1-(s/(segs-1));
      CX.globalAlpha   = frac*frac*0.9*tipFrac;
      CX.strokeStyle   = glowHex;
      CX.lineWidth     = Math.max(0.3, 0.8+frac*2.2);
      CX.shadowColor   = glowHex;
      CX.shadowBlur    = frac<0.25 ? 14 : 0;
      CX.beginPath(); CX.moveTo(core[i0].x,core[i0].y);
      for (let i=i0+1;i<=i1;i++) CX.lineTo(core[i].x,core[i].y);
      CX.stroke(); CX.shadowBlur=0;
    }
  }

  // ── SPARKLE PARTICLES ────────────────────────────────────────────────
  if (tipFrac > 0.05 && pastPts.length > 1) {
    const sparkN = Math.floor(3 + tipFrac*6);
    for (let i=0;i<sparkN;i++) {
      const idx = Math.floor(pastPts.length*(1-i/sparkN));
      if (idx<0||idx>=pastPts.length) continue;
      const sp = pastPts[idx];
      const vf = Math.min(1,sp.val/maxVal);
      const sa = vf*(0.25+Math.sin(phi*2.2+i*1.9)*0.2);
      if (sa<0.03) continue;
      const sr = Math.max(0.3, 0.5+vf*1.8);
      CX.globalAlpha=sa; CX.fillStyle=glowHex;
      CX.shadowColor=glowHex; CX.shadowBlur=5;
      CX.beginPath(); CX.arc(sp.x,sp.y,sr,0,Math.PI*2); CX.fill();
      CX.shadowBlur=0;
    }
  }

  // ── FUTURE PREDICTION ────────────────────────────────────────────────
  if (futurePts.length>1) {
    const futS=swirlPath(futurePts,0.3,0.8,1.2,maxVal);
    CX.globalAlpha=0.28*tipFrac; CX.strokeStyle=glowHex; CX.lineWidth=0.9;
    CX.setLineDash([3,9]);
    CX.beginPath(); CX.moveTo(tip.x,tip.y);
    for (const p of futS) CX.lineTo(p.x,p.y);
    CX.stroke(); CX.setLineDash([]);
  }

  // ── TIP ORB ──────────────────────────────────────────────────────────
  if (tipFrac>0.02) {
    const r=Math.max(0.5,4+tipFrac*12);
    CX.globalAlpha=0.85;
    const og=CX.createRadialGradient(tip.x,tip.y,0,tip.x,tip.y,Math.max(0.5,r*3));
    og.addColorStop(0,glowHex); og.addColorStop(0.4,`rgba(${colorRGB},0.2)`); og.addColorStop(1,'transparent');
    CX.fillStyle=og; CX.shadowColor=glowHex; CX.shadowBlur=16;
    CX.beginPath(); CX.arc(tip.x,tip.y,Math.max(0.5,r*3),0,Math.PI*2); CX.fill(); CX.shadowBlur=0;
    CX.fillStyle=glowHex;
    CX.beginPath(); CX.arc(tip.x,tip.y,Math.max(0.3,r*0.4),0,Math.PI*2); CX.fill();
  }

  CX.restore();
}
// ── STREAM HELPERS ────────────────────────────────────────────────────────────
function zoneFill(smoothPts, edgeY) {
  if (smoothPts.length<2) return;
  CX.beginPath(); CX.moveTo(smoothPts[0].x,edgeY);
  CX.lineTo(smoothPts[0].x,smoothPts[0].y);
  for (let i=1;i<smoothPts.length;i++) {
    const p=smoothPts[i-1],c=smoothPts[i];
    CX.quadraticCurveTo(p.x,p.y,(p.x+c.x)/2,(p.y+c.y)/2);
  }
  CX.lineTo(smoothPts[smoothPts.length-1].x,smoothPts[smoothPts.length-1].y);
  CX.lineTo(smoothPts[smoothPts.length-1].x,edgeY);
  CX.closePath();
}

function smoothPath(pts) {
  // Return smoothed version of pts using rolling average
  if (pts.length<3) return pts;
  return pts.map((p,i)=>{
    if (i===0||i===pts.length-1) return p;
    const prev=pts[i-1],next=pts[i+1];
    return {...p, x:(prev.x+p.x*2+next.x)/4, y:(prev.y+p.y*2+next.y)/4};
  });
}

function swirlPath(pts, swirlAmp, swirlFreq, phaseOffset, maxVal) {
  // Add organic sine-based lateral movement perpendicular to path direction
  if (pts.length<2) return pts;
  const mv = maxVal || 1;
  return pts.map((p,i)=>{
    if (p.val==null) return p;
    const ageFrac=Math.max(0,Math.min(1,(viewTime-p.t)/(3*3600000)));
    const vf=Math.min(1,(p.val/mv)||0.5);
    // Swirl amplitude fades toward tip (newer = more focused) and with spent value
    const amp=swirlAmp*vf*(0.3+ageFrac*0.7);
    // Perpendicular direction
    const perp=getPerpendicular(pts,i);
    const wave=Math.sin(i*swirlFreq*0.15+phi*(0.3+swirlAmp*0.1)+phaseOffset)*amp;
    const waveS=Math.sin(i*swirlFreq*0.07+phi*0.2+phaseOffset+2.1)*amp*0.4;
    return {...p, x:p.x+perp.nx*(wave+waveS), y:p.y+perp.ny*(wave+waveS)};
  });
}

function getPerpendicular(pts, i) {
  // Unit vector perpendicular to path at point i
  const p0=pts[Math.max(0,i-1)], p1=pts[Math.min(pts.length-1,i+1)];
  const dx=p1.x-p0.x, dy=p1.y-p0.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  return {nx:-dy/len, ny:dx/len}; // rotated 90°
}

// ── BG HISTORY TRAIL ─────────────────────────────────────────────────────
function drawBGTrail(pal) {
  const leftT  = Math.max(CGM_START, xT(0));
  const n      = Math.min(400, Math.max(100, Math.floor(W/1.5)));
  const pts    = [];
  const nowT   = viewTime;

  for (let i=0; i<=n; i++) {
    const t  = leftT + (i/n)*(nowT-leftT);
    const d  = dataAt(t);
    const x  = tX(t);
    const y  = bgToY(d.bg);
    const inRange = d.bg >= BG_LOW && d.bg <= BG_HIGH;
    pts.push({x, y, bg:d.bg, inRange, t});
  }
  if (pts.length < 2) return;

  CX.save();

  // ── Glow shadow pass (wide soft glow) ──
  CX.globalAlpha = 0.18;
  CX.strokeStyle = 'rgba(255,255,255,0.8)';
  CX.lineWidth   = 6;
  CX.shadowColor = 'rgba(200,255,220,0.6)';
  CX.shadowBlur  = 12;
  CX.lineJoin    = 'round'; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length-1;i++) {
    const mid={x:(pts[i].x+pts[i+1].x)/2, y:(pts[i].y+pts[i+1].y)/2};
    CX.quadraticCurveTo(pts[i].x,pts[i].y,mid.x,mid.y);
  }
  CX.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
  CX.stroke();
  CX.shadowBlur=0;

  // ── Coloured core line — green in range, amber above, blue below ──
  // Draw in segments by colour
  let seg=[];
  for (let i=0;i<pts.length;i++) {
    const p = pts[i];
    const col = p.bg > BG_HIGH ? 'rgba(230,140,40,0.85)' :
                p.bg < BG_LOW  ? 'rgba(80,130,220,0.85)' :
                                  'rgba(80,220,160,0.9)';
    if (seg.length===0 || seg[seg.length-1].col===col) {
      seg.push({...p, col});
    } else {
      // Draw segment
      CX.globalAlpha=0.9;
      CX.strokeStyle=seg[0].col; CX.lineWidth=2.2;
      CX.shadowColor=seg[0].col; CX.shadowBlur=4;
      CX.beginPath(); CX.moveTo(seg[0].x,seg[0].y);
      for (let j=1;j<seg.length;j++) CX.lineTo(seg[j].x,seg[j].y);
      CX.stroke(); CX.shadowBlur=0;
      seg=[{...p,col}];
    }
  }
  // Draw final segment
  if (seg.length>1) {
    CX.globalAlpha=0.9;
    CX.strokeStyle=seg[0].col; CX.lineWidth=2.2;
    CX.shadowColor=seg[0].col; CX.shadowBlur=4;
    CX.beginPath(); CX.moveTo(seg[0].x,seg[0].y);
    for (let j=1;j<seg.length;j++) CX.lineTo(seg[j].x,seg[j].y);
    CX.stroke(); CX.shadowBlur=0;
  }

  // ── Dots at BG readings (every ~15min) for clarity ──
  const dotInterval = (viewSpan/W) * W / 18; // ~18 dots visible
  let lastDotT = 0;
  for (const p of pts) {
    if (p.t - lastDotT < dotInterval) continue;
    lastDotT = p.t;
    const col = p.bg > BG_HIGH ? '#e68c28' : p.bg < BG_LOW ? '#5082dc' : '#50dcA0';
    const r   = p.bg > BG_HIGH || p.bg < BG_LOW ? 3.5 : 2.5;
    CX.globalAlpha=0.8;
    CX.fillStyle=col;
    CX.shadowColor=col; CX.shadowBlur=6;
    CX.beginPath(); CX.arc(p.x,p.y,r,0,Math.PI*2); CX.fill();
    CX.shadowBlur=0;
  }

  // ── FUTURE PREDICTION — faint dotted BG forecast ────────────────
  // Projects BG forward based on current IOB/COB balance
  if (pts.length > 2) {
    const d0   = dataAt(viewTime);
    const predPts = [];
    const steps   = 24; // 2h in 5min steps
    for (let i=1; i<=steps; i++) {
      const minsAhead = i * 5;
      const ft  = viewTime + minsAhead * 60000;
      const fx  = tX(ft);
      if (fx > W+20) break;
      const iobEffect = d0.iob > 0 ? -(d0.iob * iobF(minsAhead) * 2.5) : 0;
      const cobEffect = d0.cob > 0 ? +(d0.cob * cobF(minsAhead) * 0.05) : 0;
      const prev5  = dataAt(viewTime - 5*60000);
      const rocBG  = (d0.bg - prev5.bg);
      const rocDecay = rocBG * Math.exp(-minsAhead/20);
      const predBG = Math.max(2.0, Math.min(20, d0.bg + iobEffect + cobEffect + rocDecay));
      predPts.push({x:fx, y:bgToY(predBG), bg:predBG, t:ft});
    }
    if (predPts.length > 1) {
      CX.save();
      CX.globalAlpha = 0.35;
      CX.setLineDash([4, 8]);
      CX.lineWidth  = 1.8;
      CX.lineJoin   = 'round';
      CX.lineCap    = 'round';
      // Start segment from last known point
      const lastPt  = pts[pts.length-1];
      let segStart  = {x:lastPt.x, y:lastPt.y};
      let segPts    = [segStart];
      let segCol    = lastPt.bg > BG_HIGH ? 'rgba(230,140,40,0.7)' :
                      lastPt.bg < BG_LOW  ? 'rgba(80,130,220,0.7)' :
                                             'rgba(80,220,160,0.7)';
      for (const p of predPts) {
        const col = p.bg > BG_HIGH ? 'rgba(230,140,40,0.7)' :
                    p.bg < BG_LOW  ? 'rgba(80,130,220,0.7)' :
                                      'rgba(80,220,160,0.7)';
        if (col !== segCol && segPts.length > 1) {
          CX.strokeStyle = segCol;
          CX.beginPath(); CX.moveTo(segPts[0].x, segPts[0].y);
          for (const s of segPts.slice(1)) CX.lineTo(s.x, s.y);
          CX.stroke();
          segPts = [segPts[segPts.length-1]];
          segCol = col;
        }
        segPts.push(p);
      }
      if (segPts.length > 1) {
        CX.strokeStyle = segCol;
        CX.beginPath(); CX.moveTo(segPts[0].x, segPts[0].y);
        for (const s of segPts.slice(1)) CX.lineTo(s.x, s.y);
        CX.stroke();
      }
      CX.setLineDash([]);
      CX.restore();
    }
  }

  CX.restore();
}

// ── BOLUS MARKERS ────────────────────────────────────────────
function drawBolusMarkers(pal) {
  CX.save();
  const allEvents=[...BOLUS_EVENTS, ...SESSION.map(s=>({t:s.t,c:s.c||0,u:s.u||0}))];
  for (const b of allEvents) {
    const x=tX(b.t);
    if (x<-60||x>W+60) continue;
    const d=dataAt(b.t);
    if (b.c>2) {
      const cy=cobY(d.cob,x,d.bg);
      const elapsed=(viewTime-b.t)/60000;
      const pulsePhase=Math.min(1,elapsed/20);
      const fadeFrac=Math.max(0,1-elapsed/90);
      if (fadeFrac>0.01) {
        for (let ring=0;ring<3;ring++) {
          const rPhase=(pulsePhase+ring*0.22)%1;
          const r=Math.max(0.5,8+rPhase*28*(Math.min(b.c,60)/40));
          CX.globalAlpha=fadeFrac*(1-rPhase)*0.4;
          CX.strokeStyle='#c87832'; CX.lineWidth=1.4-ring*0.4;
          CX.shadowColor='#e09040'; CX.shadowBlur=3;
          CX.beginPath(); CX.arc(x,cy,r,0,Math.PI*2); CX.stroke(); CX.shadowBlur=0;
        }
        CX.globalAlpha=fadeFrac*0.8; CX.fillStyle='#e09040';
        CX.shadowColor='#e09040'; CX.shadowBlur=8;
        CX.beginPath(); CX.arc(x,cy,Math.max(0.5,2.5+fadeFrac*2),0,Math.PI*2); CX.fill(); CX.shadowBlur=0;
      }
    }
    if (b.u>0.1) {
      const iy=iobY(d.iob,x,d.bg);
      const delay=15;
      const elapsed=(viewTime-b.t)/60000-delay;
      const pulsePhase=elapsed<0?0:Math.min(1,elapsed/(IOB_PEAK-delay));
      const fadeFrac=Math.max(0,1-Math.max(0,elapsed)/120);
      if (fadeFrac>0.01&&elapsed>-5) {
        for (let ring=0;ring<3;ring++) {
          const rPhase=(pulsePhase+ring*0.25)%1;
          const r=Math.max(0.5,6+rPhase*22*(Math.min(b.u,5)/3));
          CX.globalAlpha=fadeFrac*(1-rPhase)*0.35;
          CX.strokeStyle='#3a6aaa'; CX.lineWidth=1.2-ring*0.3;
          CX.shadowColor='#5080cc'; CX.shadowBlur=3;
          CX.beginPath(); CX.arc(x,iy,r,0,Math.PI*2); CX.stroke(); CX.shadowBlur=0;
        }
        CX.globalAlpha=fadeFrac*0.75; CX.fillStyle='#5080cc';
        CX.shadowColor='#5080cc'; CX.shadowBlur=8;
        CX.beginPath(); CX.arc(x,iy,Math.max(0.5,2+fadeFrac*2),0,Math.PI*2); CX.fill(); CX.shadowBlur=0;
      }
    }
  }
  CX.restore();
}
// ── DRAWING: THE BOAT ────────────────────────────────────────
function drawBoat(pal, d) {
  const nowX  = NOW_X*W;
  const boatY = boatYfromBG(d.bg);
  const prev  = dataAt(viewTime - 10*60000);
  const rate  = (d.bg - prev.bg) / (10/60);
  const tilt  = Math.max(-0.3, Math.min(0.3, rate*0.025));
  const bob   = Math.sin(phi*1.1)*2.5;
  const isNight = pal.isNight;
  const woodDark  = isNight ? '#3a2818' : '#5c3820';
  const woodLight = isNight ? '#6a4830' : '#8B5E3C';
  const woodHi    = isNight ? '#8a6848' : '#b8844e';

  CX.save();
  CX.translate(nowX, boatY+bob);
  CX.rotate(tilt);

  // NOTE: straight wake lines removed — COB/IOB streams ARE the wake
  const bW=18, bL=46; // bigger, more cartoon

  // Water shadow
  CX.save(); CX.globalAlpha=0.15;
  CX.fillStyle='rgba(0,0,0,0.6)';
  CX.beginPath(); CX.ellipse(0,5,bL*0.85,bW*0.65,0,0,Math.PI*2); CX.fill(); CX.restore();

  // Outer hull
  const hg=CX.createLinearGradient(0,-bW,0,bW);
  hg.addColorStop(0,woodDark); hg.addColorStop(0.35,woodLight);
  hg.addColorStop(0.65,woodLight); hg.addColorStop(1,woodDark);
  CX.fillStyle=hg;
  // Rounder cartoon hull - wider belly, more pronounced curve
  CX.beginPath();
  CX.moveTo(-bL,-bW*0.45);          // stern port
  CX.lineTo(-bL, bW*0.45);          // stern starboard
  CX.bezierCurveTo(-bL+bL*0.25,bW*1.0, bL*0.3,bW*0.85, bL*0.75,bW*0.3);
  CX.bezierCurveTo(bL*0.9,bW*0.12, bL,0, bL,0);   // bow tip
  CX.bezierCurveTo(bL*0.9,-bW*0.12, bL*0.75,-bW*0.3, bL*0.3,-bW*0.85);
  CX.bezierCurveTo(-bL+bL*0.25,-bW*1.0, -bL,-bW*0.45, -bL,-bW*0.45);
  CX.closePath(); CX.fill();

  // Stern face
  const sg2=CX.createLinearGradient(-bL,-bW*0.55,-bL+4,bW*0.55);
  sg2.addColorStop(0,woodHi); sg2.addColorStop(0.5,woodLight); sg2.addColorStop(1,woodDark);
  CX.fillStyle=sg2;
  CX.beginPath();
  CX.moveTo(-bL,-bW*0.55); CX.lineTo(-bL,bW*0.55);
  CX.lineTo(-bL+5,bW*0.5); CX.lineTo(-bL+5,-bW*0.5); CX.closePath(); CX.fill();

  // Interior hollow
  const ig=CX.createLinearGradient(0,-bW*0.5,0,bW*0.5);
  ig.addColorStop(0,'rgba(20,10,4,0.75)'); ig.addColorStop(0.5,'rgba(40,20,8,0.55)');
  ig.addColorStop(1,'rgba(20,10,4,0.75)');
  CX.fillStyle=ig;
  CX.beginPath();
  CX.moveTo(-bL+10,-bW*0.35);
  CX.bezierCurveTo(-bL+bL*0.25,-bW*0.65, bL*0.35,bW*0.55*0.7, bL*0.8,bW*0.1);
  CX.bezierCurveTo(bL*0.9,bW*0.04, bL*0.92,0, bL*0.88,0);
  CX.bezierCurveTo(bL*0.92,-0.04*bW, bL*0.8,-bW*0.1, bL*0.5,-bW*0.45);
  CX.bezierCurveTo(bL*0.35,-bW*0.55*0.7, -bL+bL*0.25,bW*0.65*0.5, -bL+10,bW*0.35);
  CX.closePath(); CX.fill();

  // Plank lines
  CX.save(); CX.globalAlpha=0.18; CX.strokeStyle=woodDark; CX.lineWidth=0.6;
  for (const yo of [-bW*0.28,-bW*0.06,bW*0.06,bW*0.28]) {
    CX.beginPath(); CX.moveTo(-bL+8,yo*0.6);
    CX.bezierCurveTo(0,yo*0.85, bL*0.5,yo*0.75, bL*0.82,yo*0.2); CX.stroke();
  }
  CX.restore();

  // Gunwale highlight
  CX.save(); CX.globalAlpha=0.4; CX.strokeStyle=woodHi; CX.lineWidth=1.2;
  CX.beginPath();
  CX.moveTo(-bL,-bW*0.55);
  CX.bezierCurveTo(-bL+bL*0.3,-bW*0.9, bL*0.4,-bW*0.65, bL,-0.05*bW);
  CX.stroke(); CX.restore();

  // Rim glow
  CX.save(); CX.globalAlpha=0.1+Math.sin(phi)*0.04;
  CX.strokeStyle='rgba(180,230,190,0.9)'; CX.lineWidth=1;
  CX.shadowColor='rgba(140,210,155,0.6)'; CX.shadowBlur=5;
  CX.beginPath();
  CX.moveTo(-bL,-bW*0.55);
  CX.bezierCurveTo(-bL+bL*0.3,-bW*0.9, bL*0.4,-bW*0.65, bL*0.85,-bW*0.2);
  CX.bezierCurveTo(bL*0.95,-bW*0.08, bL,0, bL,0);
  CX.stroke(); CX.shadowBlur=0; CX.restore();

  CX.restore();
}

// ── DRAWING: FUTURE MIST ─────────────────────────────────────
function drawFutureMist(pal) {
  const nowX = NOW_X*W;
  const skyH = HORIZON*H;
  const mg = CX.createLinearGradient(nowX,0,W,0);
  mg.addColorStop(0,   'rgba(255,255,255,0)');
  mg.addColorStop(0.08, pal.mist.replace(/[\d.]+\)$/,'0.1)'));
  mg.addColorStop(0.35, pal.mist);
  const mistOpaque = pal.mist.replace(/[\d.]+\)$/, v => Math.min(1,parseFloat(v)+0.2)+')');
  mg.addColorStop(1,   mistOpaque);
  CX.fillStyle=mg; CX.fillRect(nowX,skyH,W-nowX,H-skyH);
  // Dashed now-line
  CX.save(); CX.globalAlpha=0.1;
  CX.strokeStyle='rgba(40,55,50,0.6)'; CX.lineWidth=0.8;
  CX.setLineDash([2,8]);
  CX.beginPath(); CX.moveTo(nowX,skyH+10); CX.lineTo(nowX,H-20); CX.stroke();
  CX.setLineDash([]); CX.restore();
}

// ── DRAWING: POD→PEN TRANSITION ──────────────────────────────
function drawTransition(pal) {
  const tx = tX(POD_PAUSE_T);
  if (tx<-40||tx>W+40) return;
  const skyH = HORIZON*H;
  const logY = skyH+(H-skyH)*0.5;
  CX.save();
  // Ripple rings
  CX.globalAlpha=0.07;
  CX.strokeStyle=pal.isNight?'rgba(140,170,200,0.8)':'rgba(40,55,50,0.8)';
  CX.lineWidth=0.8;
  for (let r=1;r<=4;r++) {
    CX.beginPath(); CX.ellipse(tx,logY,Math.max(1,r*14),Math.max(1,r*6),0,0,Math.PI*2); CX.stroke();
  }
  // Mossy log
  CX.globalAlpha=0.5;
  const lg=CX.createRadialGradient(tx,logY,0,tx,logY,18);
  lg.addColorStop(0,'#3a4828'); lg.addColorStop(0.6,'#2a3818'); lg.addColorStop(1,'transparent');
  CX.fillStyle=lg;
  CX.beginPath(); CX.ellipse(tx,logY,18,8,0,0,Math.PI*2); CX.fill();
  // Moss dots
  CX.globalAlpha=0.28;
  const mrng=seededRand(88);
  for (let i=0;i<8;i++) {
    const mx=tx+(mrng()-0.5)*24, my=logY+(mrng()-0.5)*10;
    CX.fillStyle=`rgba(${60+Math.floor(mrng()*30)},${80+Math.floor(mrng()*30)},${50+Math.floor(mrng()*20)},1)`;
    CX.beginPath(); CX.arc(mx,my,Math.max(0.5,1.5+mrng()*2),0,Math.PI*2); CX.fill();
  }
  // Label
  CX.globalAlpha=0.22;
  CX.fillStyle=pal.isNight?'rgba(180,200,220,1)':'rgba(40,55,50,1)';
  CX.font="italic 9px 'Fraunces',serif";
  CX.textAlign='center';
  CX.fillText('pen · 16 mar', tx, skyH+12);
  CX.restore();
}

// ── DRAWING: TIME LABELS ─────────────────────────────────────
const DNAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function drawTimeLabels(pal) {
  const mspp=viewSpan/W;
  let tickMs=3600000;
  if (mspp*W>20*3600000) tickMs=6*3600000;
  if (mspp*W>48*3600000) tickMs=12*3600000;
  const nd=new Date(viewTime);
  const el=document.getElementById('timelabel');
  if (el) el.textContent=`${DNAMES[nd.getDay()]} ${nd.getHours().toString().padStart(2,'0')}:${nd.getMinutes().toString().padStart(2,'0')}`;
  const skyH=HORIZON*H, nowX=NOW_X*W;
  const startT=xT(0), endT=xT(W);
  const firstT=Math.ceil(startT/tickMs)*tickMs;
  const textBase=pal.isNight?'220,235,255':'40,60,50';
  CX.save(); CX.textAlign='center';
  for (let t=firstT;t<=endT;t+=tickMs) {
    const x=tX(t);
    if (x<30||x>W-30) continue;
    const d=new Date(t);
    const lbl=d.getHours()===0?DNAMES[d.getDay()]:d.getHours().toString().padStart(2,'0')+':00';
    const distPx=Math.abs(x-nowX);
    if (distPx<W*0.04) {
      CX.globalAlpha=0.6;
      CX.fillStyle=`rgba(${textBase},1)`;
      CX.font=`200 40px 'Fraunces',serif`;
      CX.fillText(lbl,x,skyH-20);
      CX.globalAlpha=0.1;
      CX.shadowColor=pal.isNight?'rgba(180,210,255,1)':'rgba(255,255,255,1)';
      CX.shadowBlur=22; CX.fillText(lbl,x,skyH-20); CX.shadowBlur=0;
    } else {
      const distFrac=Math.min(1,distPx/(W*0.42));
      // More visible — larger minimum size, higher opacity
      const sz = Math.max(12, 22*(1-distFrac*0.55));
      const al = Math.max(0.15, 0.55*(1-distFrac*0.8));
      CX.globalAlpha=al;
      CX.fillStyle=`rgba(${textBase},1)`;
      CX.font=`200 ${sz.toFixed(0)}px 'Fraunces',serif`;
      CX.fillText(lbl,x,skyH-10);
    }
  }
  CX.restore();
}

// ── HUD UPDATE ───────────────────────────────────────────────
let lastHUD=0;
function updateHUD(d, pal) {
  if (Date.now()-lastHUD<300) return; lastHUD=Date.now();

  // Stale data check — warn if last real reading is old
  const staleWarn = document.getElementById('stale-warn');
  if (staleWarn) {
    const minsStale = _lastReadingT>0 ? Math.round((Date.now()-_lastReadingT)/60000) : 0;
    const isStale   = minsStale > 12 && _lastReadingT > 0;
    staleWarn.style.display = isStale ? 'block' : 'none';
    if (isStale) staleWarn.textContent = `⚠ no reading for ${minsStale}m`;
  }

  const prev15=dataAt(viewTime-15*60000);
  const delta=d.bg-prev15.bg;
  const arr=delta>1.5?'↑↑':delta>0.5?'↑':delta<-1.5?'↓↓':delta<-0.5?'↓':'→';
  const bgEl=document.getElementById('bg-num');
  const color=d.bg<BG_LOW?'rgba(50,80,160,0.7)':d.bg>BG_HIGH?'rgba(160,80,30,0.7)':pal.bgText;
  bgEl.innerHTML=d.bg.toFixed(1)+`<span style="font-size:20px;opacity:0.4;margin-left:3px">${arr}</span>`;
  bgEl.style.color=color;
  document.getElementById('bg-unit').style.color=(pal.bgText||'rgba(40,60,50,0.65)').replace('0.65','0.35').replace('0.7','0.4');
  document.getElementById('mc-val').textContent=d.cob.toFixed(0)+'g';
  document.getElementById('mi-val').textContent=d.iob.toFixed(1)+'U';
  const prog=(viewTime-CGM_START)/(CGM_END-CGM_START);
  document.getElementById('timenow').style.left=(Math.max(0,Math.min(1,prog))*100).toFixed(1)+'%';
}

// ── MAIN FRAME ───────────────────────────────────────────────
function returnToNow() {
  viewTime = HISTORY_RAW[HISTORY_RAW.length-1].t;
  viewSpan = 2 * 3600000; // fixed 2h
  document.getElementById('now-btn').style.display='none';
}

// Track if user has scrolled away from now
let _isAtNow = true;

function frame(ts) {
  const dt=Math.min((ts-t0)/1000, 0.05); t0=ts;
  phi+=0.4*dt;
  treeScrollX+=10*dt; // river current speed

  const d   = dataAt(viewTime);
  const pal = palette(viewTime);

  drawSky(pal);
  drawWater(pal, d);
  drawLilyPads(pal, d);

  const cobPts = buildWakePts('cob', cobY, 90);
  const iobPts = buildWakePts('iob', iobY, 90);
  // Inject gentle base flow so the river always shows currents
  // even when COB/IOB are zero (acts as ambient river texture)
  const boatNowY = boatYfromBG(d.bg);
  const baseFlow = Math.max(0, Math.sin(phi*0.15)*0.08+0.06); // slow pulse
  if (cobPts.length>0 && cobPts[cobPts.length-1].val < 1) {
    cobPts[cobPts.length-1].val = baseFlow * MAX_COB * 0.12;
  }
  if (iobPts.length>0 && iobPts[iobPts.length-1].val < 0.1) {
    iobPts[iobPts.length-1].val = baseFlow * MAX_IOB * 0.15;
  }
  drawWake(cobPts, '60,180,140', '#3ecfa0', MAX_COB, true,  false);
  drawWake(iobPts, '40,80,180',  '#2855c8', MAX_IOB, false, false);

  // ── BG HISTORY TRAIL — the path the boat has taken ──────────────
  drawBGTrail(pal);

  drawBolusMarkers(pal);
  drawTransition(pal);
  drawTimeLabels(pal);
  drawFutureMist(pal);
  drawBoat(pal, d);

  // Live reading pulse — flashes when new data arrives
  if (_pulseAlpha > 0.01) {
    const nowX = NOW_X*W, boatY = boatYfromBG(d.bg);
    const pr = 20 + (1-_pulseAlpha)*40;
    CX.save(); CX.globalAlpha = _pulseAlpha * 0.5;
    CX.strokeStyle = 'rgba(200,240,200,0.8)'; CX.lineWidth = 1.5;
    CX.shadowColor = '#80e890'; CX.shadowBlur = 10;
    CX.beginPath(); CX.arc(nowX, boatY, Math.max(0.5, pr), 0, Math.PI*2); CX.stroke();
    CX.shadowBlur = 0; CX.restore();
    _pulseAlpha *= 0.94;
  }

  // Show "return to now" when scrolled away from latest data
  const latestT = HISTORY_RAW[HISTORY_RAW.length-1].t;
  const awayFromNow = (latestT - viewTime) > 8 * 60000;
  const nowBtn = document.getElementById('now-btn');
  if (nowBtn) nowBtn.style.opacity = awayFromNow ? '0.85' : '0';

  // Draw time label above/near the boat showing what time is at NOW position
  const nowX = NOW_X * W;
  const boatY2 = boatYfromBG(d.bg);
  const vd = new Date(viewTime);
  const timeStr = vd.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const dateStr = vd.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  CX.save();
  CX.globalAlpha = 0.65;
  CX.fillStyle = pal.bgText || 'rgba(255,255,255,0.8)';
  CX.font = "200 13px 'Fraunces',serif";
  CX.textAlign = 'center';
  CX.fillText(timeStr, nowX, boatY2 - 40);
  CX.globalAlpha = 0.3;
  CX.font = "300 9px 'DM Mono',monospace";
  CX.fillText(dateStr, nowX, boatY2 - 26);
  CX.restore();

  updateHUD(d, pal);

  requestAnimationFrame(frame);
}

// ── TOUCH / MOUSE ────────────────────────────────────────────
let drag={on:false,x0:0,t0:0}, pinch={on:false,d0:0,s0:0};
CV.addEventListener('touchstart',e=>{
  if(e.target.closest&&e.target.closest('#sheet,#logbtn')) return;
  if(e.touches.length===1) drag={on:true,x0:e.touches[0].clientX,t0:viewTime};
  else if(e.touches.length===2) {
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinch={on:true,d0:Math.hypot(dx,dy),s0:viewSpan};
  }
},{passive:true});
CV.addEventListener('touchmove',e=>{
  if(e.target.closest&&e.target.closest('#sheet')) return;
  e.preventDefault();
  if(drag.on&&e.touches.length===1) {
    viewTime=Math.max(CGM_START,Math.min(CGM_END,drag.t0-(e.touches[0].clientX-drag.x0)*(viewSpan/W)));
  } else if(pinch.on&&e.touches.length===2) {
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    viewSpan=Math.max(MIN_SPAN,Math.min(MAX_SPAN,pinch.s0*(pinch.d0/Math.hypot(dx,dy))));
  }
},{passive:false});
CV.addEventListener('touchend',()=>{drag.on=false;pinch.on=false;},{passive:true});
let md={on:false,x0:0,t0:0};
CV.addEventListener('mousedown',e=>{if(!e.target.closest('#sheet,#logbtn'))md={on:true,x0:e.clientX,t0:viewTime}});
CV.addEventListener('mousemove',e=>{if(md.on)viewTime=Math.max(CGM_START,Math.min(CGM_END,md.t0-(e.clientX-md.x0)*(viewSpan/W)))});
CV.addEventListener('mouseup',()=>md.on=false);
// wheel zoom disabled — fixed 2h view

// ── LOG SHEET ────────────────────────────────────────────────
let _st=null;
// Saved meals from session/localStorage
const SAVED_MEALS = (() => {
  try { return JSON.parse(localStorage.getItem('river_meals')||'[]'); } catch(e) { return []; }
})();

function saveMealToHistory(name, carbs, insulin, t) {
  const entry = {name, carbs, insulin, t: t||Date.now()};
  SAVED_MEALS.unshift(entry);
  if (SAVED_MEALS.length > 20) SAVED_MEALS.pop();
  try { localStorage.setItem('river_meals', JSON.stringify(SAVED_MEALS)); } catch(e) {}
}

function renderSavedMeals() {
  const row = document.getElementById('saved-meals-row');
  const chips = document.getElementById('saved-meals-chips');
  if (!row || !chips) return;
  if (SAVED_MEALS.length === 0) { row.style.display='none'; return; }
  row.style.display='block';
  chips.innerHTML = SAVED_MEALS.slice(0,8).map((m,i) =>
    `<button onclick="loadSavedMeal(${i})" style="padding:5px 10px;border-radius:8px;
      border:1px solid rgba(40,55,50,0.12);background:rgba(40,55,50,0.05);
      font-family:'DM Mono',monospace;font-size:10px;color:rgba(40,55,50,0.55);
      cursor:pointer">${m.name} (${m.carbs}g)</button>`
  ).join('');
}

function loadSavedMeal(idx) {
  const m = SAVED_MEALS[idx];
  if (!m) return;
  selType('b');
  document.getElementById('in-c').value = m.carbs;
  document.getElementById('in-i').value = m.insulin || '';
  onInp();
}

function setTimeNow() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset()*60000);
  document.getElementById('in-time').value = local.toISOString().slice(0,16);
}
function getEntryTime() {
  const v = document.getElementById('in-time').value;
  if (!v) return Date.now();
  return new Date(v).getTime();
}

function setCarbs(v) {
  document.getElementById('in-c').value = v;
  document.querySelectorAll('#sec-c .bgchip').forEach(c =>
    c.classList.toggle('on', parseInt(c.textContent)===v));
  onInp();
}


function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  window._pendingDrop=null;
}
function selType(t){
  _st=t;
  ['c','b','i'].forEach(x=>document.getElementById(`tb-${x}`).className='tbtn'+(x===t?` sel-${t}`:''));
  document.getElementById('sec-c').className='isec'+(['c','b'].includes(t)?' vis':'');
  document.getElementById('sec-i').className='isec'+(['i','b'].includes(t)?' vis':'');
  document.getElementById('sec-bg').className='isec'+(['c','b'].includes(t)?' vis':'');
  onInp();
}
function setBG(v){
  document.getElementById('in-bg').value=v;
  document.querySelectorAll('.bgchip').forEach(c=>c.classList.toggle('on',parseFloat(c.textContent)===v));
  onInp();
}
function onInp(){
  const c=parseFloat(document.getElementById('in-c').value)||0;
  const u=parseFloat(document.getElementById('in-i').value)||0;
  const bg=parseFloat(document.getElementById('in-bg').value)||0;
  const btn=document.getElementById('dropbtn');
  const sug=document.getElementById('sugbox');
  const has=(_st==='c'&&c>0)||(_st==='i'&&u>0)||(_st==='b'&&(c>0||u>0));
  window._pendingDrop = has ? {c, u, t:Date.now()} : null;
  btn.disabled=!has;
  if(c>0&&bg>0&&['c','b'].includes(_st)){
    const dose=(c/8.5)+(bg>10?Math.max(0,(bg-6.7)/6):0);
    const r=Math.round(dose/0.5)*0.5;
    document.getElementById('sugval').textContent=r.toFixed(1)+'U';
    document.getElementById('sugnote').textContent=`${c}g ÷ 8.5 I:C${bg>10?' + correction':''}`;
    sug.style.display='block';
    if(!document.getElementById('in-i').value&&_st==='b') document.getElementById('in-i').value=r.toFixed(1);
  } else sug.style.display='none';
  const pts=[]; if(c>0)pts.push(`${c}g`); if(u>0)pts.push(`${u}U`);
  btn.textContent=pts.length?`flow · ${pts.join(' + ')}`:'flow it in';
}
function commitDrop(){
  const c=parseFloat(document.getElementById('in-c').value)||0;
  const u=parseFloat(document.getElementById('in-i').value)||0;
  const t=getEntryTime();
  if(c>0||u>0){
    SESSION.push({t,c,u});
    try{sessionStorage.setItem('rv3',JSON.stringify(SESSION));}catch(e){}
    // Save meal to history if has carbs
    if(c>0) {
      const bg=parseFloat(document.getElementById('in-bg').value)||0;
      const mealName = c>0&&u>0?`${c}g + ${u}U`:(c>0?`${c}g carbs`:`${u}U bolus`);
      saveMealToHistory(mealName, c, u, t);
    }
    // Also update HISTORY_RAW entry for that time if it exists
    const existing = HISTORY_RAW.findIndex(h=>Math.abs(h.t-t)<150000);
    if(existing>=0) { HISTORY_RAW[existing].iob+=u; HISTORY_RAW[existing].cob+=c; }
  }
  const msg=[]; if(c>0)msg.push(`${c}g`); if(u>0)msg.push(`${u}U`);
  showToast((msg.join(' · ')||'logged')+'\ninto the river');
  ['in-c','in-i','in-bg'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('sugbox').style.display='none';
  document.getElementById('dropbtn').disabled=true;
  closeSheet();
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=msg.replace('\n','<br>');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ═══════════════════════════════════════════════════════════════════════════
//  CGM SOURCE SYSTEM
//  Pluggable data sources. Credentials stored in localStorage only.
//  Never hardcoded. Never sent anywhere except the configured endpoint.
//
//  Sources:
//    nightscout  — Nightscout-compatible URL + token (Gluroo, real NS, xDrip)
//    dexcom_share — Dexcom Share unofficial API (username + password)
//    dexcom_oauth — Dexcom official OAuth2 API (future)
//    libre        — LibreLinkUp (future)
//    manual       — No live data, manual entry only
// ═══════════════════════════════════════════════════════════════════════════

const CGM_SOURCES = {
  nightscout: {
    name: 'Nightscout / Gluroo',
    icon: '🌙',
    description: 'In Gluroo: Menu → Settings → Gluroo Global Connect Nightscout. Tap Copy → Copy JSON. Paste the URL into the URL field and the apiSecretToken value into the token field.',
    fields: [
      { key: 'url',   label: 'Nightscout URL',   placeholder: 'https://xxxx.ns.gluroo.com', type: 'url' },
      { key: 'token', label: 'API Token / Secret', placeholder: 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx', type: 'password' },
    ],
    _parse(data) {
      return data
        .filter(e => e.sgv || e.mbg)
        .map(e => ({
          t:     e.date,
          bg:    e.sgv ? +(e.sgv / 18).toFixed(1) : +(e.mbg),
          trend: e.direction || 'NONE',
          src:   'nightscout'
        }));
    },
    _proxy: 'https://orange-surf-6f98.john-king-uk.workers.dev',
    async _get(cfg, path) {
      const base   = cfg.url.replace(/\/+$/, '');
      const sep    = path.includes('?') ? '&' : '?';
      const target = base + path + sep + 'token=' + encodeURIComponent(cfg.token);
      const proxyUrl = this._proxy + '/?url=' + encodeURIComponent(target);
      let r;
      try { r = await fetch(proxyUrl); }
      catch(e) { throw new Error('Cannot reach ' + base + ' — check URL is correct'); }
      return r;
    },
    async fetch(cfg, count=1) {
      let r;
      try { r = await this._get(cfg, '/api/v1/entries.json?count=' + count); }
      catch(e) { throw e; }
      if (r.status === 401 || r.status === 403)
        throw new Error('Token rejected — get a fresh one: Gluroo → Menu → Settings → Gluroo Global Connect');
      if (!r.ok) throw new Error('Server returned ' + r.status);
      let data;
      try { data = await r.json(); } catch(e) { throw new Error('Bad response — is the URL correct?'); }
      if (!Array.isArray(data)) throw new Error('Unexpected response format');
      if (data.length === 0) throw new Error('No readings — is Dexcom Share active in the Gluroo app?');
      return this._parse(data);
    },
    async fetchRecent(cfg, hours=3) {
      const count = hours * 12 + 5;
      let r;
      try { r = await this._get(cfg, '/api/v1/entries.json?count=' + count); }
      catch(e) { throw new Error('Cannot reach server'); }
      if (!r.ok) throw new Error('Server returned ' + r.status);
      let data;
      try { data = await r.json(); } catch(e) { return []; }
      if (!Array.isArray(data)) return [];
      return this._parse(data).sort((a,b) => a.t - b.t);
    }
  },

  dexcom_share: {
    name: 'Dexcom Share',
    icon: '📡',
    description: 'Direct Dexcom Share using your Dexcom app credentials. Requires Share enabled with at least one follower. Must be served over https:// (works on GitHub Pages).',
    fields: [
      { key: 'username', label: 'Dexcom Username / Email', placeholder: 'yourname@email.com', type: 'text' },
      { key: 'password', label: 'Dexcom Password',          placeholder: '••••••••',            type: 'password' },
      { key: 'region',   label: 'Region',                    placeholder: '',                   type: 'select',
        options: [{ value:'ous', label:'Outside US (UK, EU, AU...)' }, { value:'us', label:'United States' }] },
    ],
    _session: null,
    _sessionExpiry: 0,
    _proxy: 'https://orange-surf-6f98.john-king-uk.workers.dev',
    async _post(url, body) {
      // POST via proxy — worker needs to support POST, so we send as GET with encoded body
      // Actually: send directly since Dexcom Share does allow CORS on POST from https://
      // If that fails, we fall back to proxy
      try {
        const r = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json','Accept':'application/json'},
          body: JSON.stringify(body)
        });
        return r;
      } catch(e) {
        throw new Error('Cannot reach Dexcom — check your internet connection');
      }
    },
    async _getSession(cfg) {
      if (this._session && Date.now() < this._sessionExpiry) return this._session;
      const base  = cfg.region === 'us'
        ? 'https://share2.dexcom.com/ShareWebServices/Services'
        : 'https://shareous1.dexcom.com/ShareWebServices/Services';
      const appId = 'd89443d2-327c-4a6f-89e5-496bbb0317db';
      const r1 = await this._post(`${base}/General/AuthenticatePublisherAccount`,
        { accountName: cfg.username, password: cfg.password, applicationId: appId });
      if (!r1.ok) throw new Error('Dexcom auth failed — check your username and password');
      const accountId = await r1.json();
      const r2 = await this._post(`${base}/General/LoginPublisherAccountById`,
        { accountId, password: cfg.password, applicationId: appId });
      if (!r2.ok) throw new Error('Dexcom login failed — try again');
      this._session = await r2.json();
      this._sessionExpiry = Date.now() + 55 * 60000;
      return this._session;
    },
    _parseDex(data) {
      return data.map(e => ({
        t:   parseInt(e.WT.replace(/[^0-9]/g,'')),
        bg:  +(e.Value / 18).toFixed(1),
        trend: e.Trend,
        src: 'dexcom_share'
      })).sort((a,b) => a.t - b.t);
    },
    async _dexGet(cfg, path) {
      const base = cfg.region === 'us'
        ? 'https://share2.dexcom.com/ShareWebServices/Services'
        : 'https://shareous1.dexcom.com/ShareWebServices/Services';
      const target = base + path;
      const proxyUrl = this._proxy + '/?url=' + encodeURIComponent(target);
      const r = await fetch(proxyUrl);
      if (!r.ok) { this._session = null; throw new Error('Dexcom read ' + r.status); }
      return r.json();
    },
    async fetch(cfg, count=1) {
      const sid = await this._getSession(cfg);
      const data = await this._dexGet(cfg,
        `/Publisher/ReadPublisherLatestGlucoseValues?sessionId=${sid}&minutes=1440&maxCount=${count}`);
      return this._parseDex(data);
    },
    async fetchRecent(cfg, hours=3) {
      const sid = await this._getSession(cfg);
      const data = await this._dexGet(cfg,
        `/Publisher/ReadPublisherLatestGlucoseValues?sessionId=${sid}&minutes=${hours*60}&maxCount=${hours*12+5}`);
      return this._parseDex(data);
    }
  },

  manual: {
    name: 'Manual only',
    icon: '✏️',
    description: 'No live CGM connection. Log readings manually using the drop button.',
    fields: [],
    async fetch()       { return []; },
    async fetchRecent() { return []; }
  }
};

// ── CREDENTIAL STORAGE ────────────────────────────────────────────────────
const CRED_KEY = 'river_cgm_cfg';

function saveCGMConfig(sourceId, fields) {
  try {
    localStorage.setItem(CRED_KEY, JSON.stringify({ sourceId, fields, savedAt: Date.now() }));
    return true;
  } catch(e) { return false; }
}

function loadCGMConfig() {
  try { return JSON.parse(localStorage.getItem(CRED_KEY) || 'null'); } catch(e) { return null; }
}

function clearCGMConfig() {
  localStorage.removeItem(CRED_KEY);
}

// ── LIVE POLLING ─────────────────────────────────────────────────────────
let _pollTimer     = null;
let _liveConnected = false;
let _lastReadingT  = 0;
let _sourceCfg     = null;
let _sourceId      = null;

async function startLivePolling(sourceId, cfg) {
  _sourceId  = sourceId;
  _sourceCfg = cfg;
  stopLivePolling();

  const source = CGM_SOURCES[sourceId];
  if (!source || sourceId === 'manual') return;

  // Full backfill — fetch up to 24h of real history to replace static data
  try {
    setLiveStatus('connecting', 'Loading history…');
    const recent = await source.fetchRecent(cfg, 24);
    if (recent.length > 0) {
      // Remove only the old static embedded data (pre-2026-03-20)
      // Keep any persisted live readings
      const liveDataCutoff = Date.now() - 8 * 86400000; // 8 days ago
      // Remove entries older than 8 days or from the static embed window
      const staticEmbedEnd = 1742256000000; // March 18 2026 00:00 UTC
      const filtered = HISTORY_RAW.filter(h => h.t > staticEmbedEnd || h.t > liveDataCutoff);
      HISTORY_RAW.length = 0;
      for (const h of filtered) HISTORY_RAW.push(h);
      // Merge in the fresh backfill data (fills gaps)
      ingestReadings(recent);
      setLiveStatus('live', `${recent.length} readings loaded`);
    }
  } catch(e) {
    setLiveStatus('error', e.message);
    console.warn('CGM backfill failed:', e);
  }

  // Poll every 5 minutes
  async function poll() {
    try {
      const readings = await source.fetch(_sourceCfg, 2);
      if (readings.length > 0) {
        const newest = readings[readings.length-1];
        if (newest.t > _lastReadingT) {
          ingestReadings(readings);
          _liveConnected = true;
          setLiveStatus('live', formatAge(newest.t));
          triggerNewReadingPulse();
        }
      }
    } catch(e) {
      _liveConnected = false;
      setLiveStatus('error', e.message);
      console.warn('CGM poll failed:', e);
    }
  }

  await poll(); // immediate
  _pollTimer = setInterval(poll, 5 * 60000);
}

function stopLivePolling() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  _liveConnected = false;
}

const PERSIST_KEY = 'river_cgm_history';
const PERSIST_MAX_DAYS = 7; // keep 7 days of readings

function persistReadings() {
  try {
    const cutoff = Date.now() - PERSIST_MAX_DAYS * 86400000;
    const toSave = HISTORY_RAW
      .filter(h => h.t > cutoff && h.bg > 0)
      .map(h => ({t:h.t, bg:h.bg})); // minimal footprint
    localStorage.setItem(PERSIST_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

function loadPersistedReadings() {
  try {
    const raw = JSON.parse(localStorage.getItem(PERSIST_KEY) || '[]');
    if (!Array.isArray(raw) || raw.length === 0) return;
    const cutoff = Date.now() - PERSIST_MAX_DAYS * 86400000;
    for (const r of raw) {
      if (!r.t || !r.bg || r.t < cutoff) continue;
      const exists = HISTORY_RAW.findIndex(h => Math.abs(h.t-r.t) < 90000);
      if (exists < 0) HISTORY_RAW.push({t:r.t, bg:r.bg, iob:0, cob:0, pen:1});
    }
    HISTORY_RAW.sort((a,b)=>a.t-b.t);
    updateCGMBounds();
    console.log(`Loaded ${raw.length} persisted readings (${CGM_START ? new Date(CGM_START).toLocaleDateString() : '?'} → now)`);
  } catch(e) {}
}

function ingestReadings(readings) {
  let changed = false;
  for (const r of readings) {
    if (!r.t || !r.bg || r.bg < 1 || r.bg > 30) continue;
    const existing = HISTORY_RAW.findIndex(h => Math.abs(h.t - r.t) < 90000);
    const entry = { t: r.t, bg: r.bg, iob: 0, cob: 0, pen: 1 };
    if (existing >= 0) HISTORY_RAW[existing] = { ...HISTORY_RAW[existing], bg: r.bg };
    else { HISTORY_RAW.push(entry); changed = true; }
    if (r.t > _lastReadingT) _lastReadingT = r.t;
  }
  HISTORY_RAW.sort((a,b) => a.t - b.t);
  updateCGMBounds();
  viewTime = CGM_END;
  if (changed) persistReadings(); // save whenever we get new data
}

function formatAge(t) {
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins === 1) return '1 min ago';
  if (mins < 60) return `${mins} mins ago`;
  return `${Math.round(mins/60)}h ago`;
}

let _pulseAlpha = 0;
function triggerNewReadingPulse() { _pulseAlpha = 1.0; }

// ── SETUP SCREEN ────────────────────────────────────────────────────────
function buildSetupScreen() {
  const existing = loadCGMConfig();
  const selId    = existing?.sourceId || 'nightscout';

  return `
<div id="setup-screen" style="
  position:fixed;inset:0;z-index:200;
  background:rgba(240,238,228,0.98);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;padding:24px;overflow-y:auto;
">
  <div style="max-width:440px;width:100%">

    <div style="text-align:center;margin-bottom:28px">
      <div style="font-family:'Fraunces',serif;font-style:italic;font-weight:200;
        font-size:32px;color:rgba(40,55,50,0.75);letter-spacing:-1px">Oskar's River</div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;color:rgba(40,55,50,0.3);

    </div>

    <!-- Source selector -->
    <div style="display:flex;gap:8px;margin-bottom:20px" id="source-tabs">
