<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oskar's River</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23050912' stroke='%233ecfa0' stroke-width='1.5'/><path d='M8 22 Q10 16 16 16 Q22 16 24 10' fill='none' stroke='%233ecfa0' stroke-width='2' stroke-linecap='round'/><path d='M8 22 Q10 28 16 28 Q22 28 24 22' fill='none' stroke='%232855c8' stroke-width='2' stroke-linecap='round' opacity='0.7'/><circle cx='16' cy='16' r='2.5' fill='%233ecfa0'/></svg>" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,200;0,300;1,200;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
  <div class="ripwrap"><div class="rip"></div><div class="rip"></div><div class="rip"></div></div>
  <div class="ltitle">Oskar's River</div>
  <div class="lsub">finding the current</div>
  <div style="font-family:'DM Mono',monospace;font-size:8px;color:rgba(40,55,50,0.2);margin-top:8px;letter-spacing:1px">build 20260326-86</div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <!-- BG — top centre, clear of safe area -->
  <div id="bg-wrap">
    <div id="bg-num">—<span id="bg-arrow"></span></div>
    <div id="bg-unit">mmol/L</div>
    <div id="timelabel" style="
      font-family:'DM Mono',monospace;
      font-size:11px;
      letter-spacing:0.5px;
      color:rgba(180,210,240,0.45);
      text-align:center;
      margin-top:3px;
      transition:color 0.3s, opacity 0.3s;
      pointer-events:none;">—</div>
    <div id="stale-warn" style="display:none;font-family:'DM Mono',monospace;
      font-size:10px;color:rgba(255,160,60,0.9);letter-spacing:.5px;
      margin-top:4px;text-align:center"></div>
  </div>

  <!-- COB/IOB — lives in the flow, positioned by JS tracking reservoirs -->
  <div id="mana-pill" style="
    position:fixed;
    bottom:80px;
    left:50%;transform:translateX(-50%);
    display:flex;gap:18px;align-items:center;pointer-events:none;
    transition:bottom 0.6s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.4s;
    z-index:18">
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
      <span id="mc-val" style="font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:rgba(200,140,60,0.7);transition:all .4s;letter-spacing:-0.5px">—</span>
      <span id="mc-label" style="font-family:'DM Mono',monospace;font-size:8px;color:rgba(200,140,60,0.35);letter-spacing:1px;text-transform:uppercase;transition:color .4s">carbs</span>
    </div>
    <div style="width:1px;height:24px;background:rgba(255,255,255,0.06)"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
      <span id="mi-val" style="font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:rgba(60,130,220,0.7);transition:all .4s;letter-spacing:-0.5px">—</span>
      <span id="mi-label" style="font-family:'DM Mono',monospace;font-size:8px;color:rgba(60,130,220,0.35);letter-spacing:1px;text-transform:uppercase;transition:color .4s">insulin</span>
    </div>
  </div>
</div>

</div>

<!-- Interactive controls — outside HUD, pointer-events work -->
<canvas id="flick-canvas"></canvas>
<canvas id="cgm-clock" width="72" height="72" title="CGM status" style="touch-action:none;pointer-events:none;z-index:20"></canvas>
<!-- Rail buttons — bottom left, single settings button -->
<button onclick="openSettings()" title="settings" style="
  position:fixed;
  bottom:calc(max(20px,env(safe-area-inset-bottom,20px)));
  left:14px;
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:auto;touch-action:manipulation;z-index:56">
  <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
    <circle cx="10" cy="10" r="3" stroke="rgba(180,210,230,0.7)" stroke-width="1.3"/>
    <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" stroke="rgba(180,210,230,0.5)" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
</button>
<div id="live-dot" style="
  position:fixed;
  bottom:calc(max(20px,env(safe-area-inset-bottom,20px))+50px);
  left:18px;
  width:16px;height:16px;opacity:0;
  transition:opacity .5s;z-index:20;pointer-events:none" title="CGM status">
  <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" id="live-dot-svg">
    <!-- Signal arcs -->
    <path d="M3.5 11.5 Q8 4 12.5 11.5" stroke="rgba(200,120,50,0.5)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M5.5 11.5 Q8 6.5 10.5 11.5" stroke="rgba(200,120,50,0.7)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="1.5" fill="rgba(200,120,50,0.9)"/>
  </svg>
</div>

<!-- Return to Now button — appears when scrolled back -->
<button id="now-btn" onclick="returnToNow()" style="
  position:fixed;
  bottom:calc(max(20px,env(safe-area-inset-bottom,20px)) + 54px);
  left:14px;
  pointer-events:auto;touch-action:manipulation;z-index:20;
  padding:7px 14px;border-radius:20px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.8px;
  color:rgba(255,255,255,0.6);text-transform:uppercase;
  cursor:pointer;z-index:20;pointer-events:auto;
  opacity:0;transition:opacity .3s">
  ◉ now
</button>

<div id="flow-dock" style="
  position:fixed;
  bottom:calc(max(16px,env(safe-area-inset-bottom,16px)));
  left:0;right:0;
  display:flex;gap:16px;
  justify-content:center;
  align-items:flex-end;
  z-index:25;pointer-events:none;
  touch-action:manipulation;">

  <!-- Food — flick up into flow -->
  <div class="dock-btn" id="dock-food" style="pointer-events:auto" ontouchstart="dockTouchStart(event,'food')" ontouchend="dockTouchEnd(event,'food')" onclick="openSheet()" title="add food">
    <svg viewBox="0 0 28 28" fill="none">
      <line x1="9" y1="4" x2="9" y2="13" stroke="rgba(255,140,50,0.9)" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 4 C7 4 7 9 9 10.5 C11 9 11 4 11 4" stroke="rgba(255,140,50,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="9" y1="13" x2="9" y2="24" stroke="rgba(255,140,50,0.9)" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="4" x2="17" y2="24" stroke="rgba(255,140,50,0.85)" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="4" x2="14" y2="11" stroke="rgba(255,140,50,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1.5 3"/>
      <circle cx="23" cy="7" r="5" fill="rgba(5,9,15,0.9)"/>
      <line x1="23" y1="5" x2="23" y2="9" stroke="rgba(255,140,50,0.9)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="21" y1="7" x2="25" y2="7" stroke="rgba(255,140,50,0.9)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="dock-label">food</span>
  </div>

  <!-- Hypo — golden lightning flick up -->
  <div class="dock-btn dock-btn--hypo" id="dock-hypo" style="pointer-events:auto" ontouchstart="dockTouchStart(event,'hypo')" ontouchend="dockTouchEnd(event,'hypo')" onclick="openHypoLog()" title="hypo treatment">
    <svg viewBox="0 0 28 28" fill="none">
      <path d="M16 4 L10 15 L14 15 L12 24 L20 11 L16 11 Z" fill="rgba(255,210,40,0.85)" stroke="rgba(255,220,60,0.9)" stroke-width="1" stroke-linejoin="round"/>
    </svg>
    <span class="dock-label">hypo</span>
  </div>

  <!-- Correction — long press, blue descending pulse -->
  <div class="dock-btn dock-btn--correction" id="dock-correct" style="pointer-events:auto"
    ontouchstart="correctionPressStart(event)"
    ontouchend="correctionPressEnd(event)"
    onclick="correctionTap()"
    title="correction bolus (hold)">
    <svg viewBox="0 0 28 28" fill="none">
      <rect x="11" y="5" width="6" height="12" rx="2" fill="rgba(60,130,220,0.2)" stroke="rgba(60,130,220,0.9)" stroke-width="1.8"/>
      <line x1="14" y1="8" x2="14" y2="14" stroke="rgba(60,130,220,0.9)" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="17" x2="14" y2="22" stroke="rgba(60,130,220,0.9)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M11.5 20 L14 22.5 L16.5 20" stroke="rgba(60,130,220,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="7" y1="9" x2="11" y2="9" stroke="rgba(60,130,220,0.8)" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="17" y1="9" x2="21" y2="9" stroke="rgba(60,130,220,0.8)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span class="dock-label">correct</span>
    <div id="corr-hold-ring" style="position:absolute;inset:-4px;border-radius:18px;border:2px solid rgba(60,130,220,0);transition:border-color .1s;pointer-events:none"></div>
  </div>

</div>

<div id="overlay" onclick="closeSheet()"></div>

<div id="sheet">
  <div class="handle"></div>
</div>

<div id="toast"></div>

<script src="app.bundle.js"></script>
</body>
</html>
